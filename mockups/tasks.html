<style>
/* Layout: top nav; sidebar of smart views + flat lists | task list with quick add | detail panel when a task is open. Phones: sidebar becomes a chip row, detail becomes a full-screen sheet. */
:root {

  --sunken: #eaeef0;
  --line: #d8dee2;
  --fg: #16222a;
  --muted: #5b6b75;
  --accent: #1d6a85;
  --accent-soft: #dcecf2;
  --ok: #2f7a4b;
  --ok-soft: #e0f0e5;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3372b;
  --bad-soft: #f9e1de;
  --waive: #6b6480;
  --waive-soft: #ebe8f2;
  --p-high: #c2410c;
  --p-med: #b7860b;
  --p-low: #2f6fb3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
    --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
    --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
    --p-high: #fb923c; --p-med: #e2b04f; --p-low: #6aa8e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
  --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
  --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;

.col h3.bad span { color: var(--bad); }
.col .row { grid-template-columns: 22px minmax(0, 1fr); padding: 8px 10px; }

<script>
const TODAY = d("2026-10-12");
function d(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
function iso(x) { return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
function add(x, n) { const y = new Date(x); y.setDate(y.getDate() + n); return y; }
function diff(a, b) { return Math.round((a - b) / 86400000); }
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], DOWL = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmt = x => DOW[x.getDay()] + " " + MON[x.getMonth()] + " " + x.getDate();
const short = x => MON[x.getMonth()] + " " + x.getDate();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const PEOPLE = Object.fromEntries(HQ.settings.team.map(([k, n]) => [k, n]));
// Links a task can point to. Deals match the pipeline mockup.
// Links point at the shared people (HQ.contacts); rebuilt on every render.
const LINKS = {}, CID = {};
function syncLinks() {
  Object.entries(HQ.contacts).forEach(([cid, c]) => { LINKS[cid] = { kind: "person", label: c.name, full: `${c.name} · ${c.stage}` }; CID[cid] = cid; });
  Object.keys(LINKS).forEach(k => { if (!HQ.contacts[k]) { delete LINKS[k]; delete CID[k]; } });
}

// One task list everywhere: tasks typed here with no client, plus every client's tasks and file checklist steps (live, shared with the contact page).
let own = [], tasks = [], seq = 0;
const MSN = { fa: "Final Acceptance", insp: "Inspection deadline", ws: "Written Statement", hoa: "HOA rescission", close: "Closing" };
const wraps = {};
function gather() {
  const out = own.slice();
  Object.entries(HQ.contacts).forEach(([cid, c]) => c.tasks.forEach(t => {
    if (!t.due) return;
    if (t.id === undefined) t.id = "c" + (seq++);
    t.link = cid; t.kind = t.kind || "task"; t.p = t.p || 0; t.done = t.s === "done"; out.push(t);
  }));
  HQ.files.forEach(dl => dl.tasks.forEach(t => {
    if (!["open", "done"].includes(t.s) || (t.a && dl.msStatus && dl.msStatus[t.a] === "waived")) return;
    const due = t.fixed ? t.fixed : t.a && dl.ms && dl.ms[t.a] ? iso(add(d(dl.ms[t.a]), t.o)) : null; if (!due) return;
    const key = "f" + dl.id + "-" + t.id, w = wraps[key] = wraps[key] || { id: key, p: 0 };
    const file = dl.kind === "pa" ? (dl.side === "buyer" ? "Buyer contract" : "Seller contract") : dl.kind === "buyer" ? "Buyer checklist" : "Listing checklist";
    Object.assign(w, { t: t.t, due, who: t.who, link: dl.cid, kind: t.kind || "task", ref: t, done: t.s === "done",
      step: { phase: t.phase, file, rule: t.a ? `${MSN[t.a]} ${t.o === 0 ? "day of" : (t.o > 0 ? "+ " : "− ") + Math.abs(t.o) + " days"}` : "set when the checklist started" } });
    out.push(w);
  }));
  out.push(...dateTasks());
  tasks = out;
}
// Important dates: every birthday and homeiversary, run through Admin → Date reminders.
const dateDone = {};
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
function monthDay(s) {
  if (!s) return null; const t = String(s).trim().toLowerCase();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return [+m[2] - 1, +m[3]];
  m = t.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})/); if (m && MONTHS.includes(m[1])) return [MONTHS.indexOf(m[1]), +m[2]];
  m = t.match(/^(\d{1,2})\/(\d{1,2})/); if (m) return [+m[1] - 1, +m[2]];
  return null;
}
function dateTasks() {
  const out = [], firstOf = n => n.split("&")[0].trim().split(" ")[0];
  Object.entries(HQ.contacts).forEach(([cid, c]) => {

/* ---------- Quick add parsing ---------- */
function parse(text) {
  let s = " " + text + " ", out = {};
  const take = re => { const m = s.match(re); if (m) s = s.replace(m[0], " "); return m; };
  let m;
  if ((m = take(/\s(every\s+(day|week|month|year)|daily|weekly|monthly|yearly)\s/i))) {
    const w = m[1].toLowerCase(); out.repeat = { day: "Daily", daily: "Daily", week: "Weekly", weekly: "Weekly", month: "Monthly", monthly: "Monthly", year: "Yearly", yearly: "Yearly" }[m[2] ? m[2].toLowerCase() : w];
  }
  if ((m = take(/\s(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s/i))) out.time = `${+m[1]}:${m[2] || "00"}${m[3].toLowerCase()}`;
  if ((m = take(/\s(today|tonight)\s/i))) out.due = iso(TODAY);
  else if ((m = take(/\s(tomorrow|tmrw)\s/i))) out.due = iso(add(TODAY, 1));
  else if ((m = take(/\s(next week)\s/i))) out.due = iso(add(TODAY, 7));
  else if ((m = take(/\s(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(day|nesday|rsday|urday)?\s/i))) {
    const k = DOWL.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0, 3)));
    let n = (k - TODAY.getDay() + 7) % 7; if (n === 0) n = 7;
    out.due = iso(add(TODAY, n));
  }
  if ((m = take(/\s!(high|h|3|med|medium|m|2|low|l|1)\s/i))) out.p = { high: 3, h: 3, 3: 3, med: 2, medium: 2, m: 2, 2: 2, low: 1, l: 1, 1: 1 }[m[1].toLowerCase()];
  if ((m = take(/\s#([\w-]+)\s/))) { const l = LISTS.find(x => x.toLowerCase() === m[1].toLowerCase()); out.list = l || m[1][0].toUpperCase() + m[1].slice(1); out.newList = !l; }
  if ((m = take(/\s@(assistant|alyssa|luke|me)\s/i))) out.who = /luke|me/i.test(m[1]) ? "LP" : "AS";
  if ((m = s.match(/\s(?:re|for|with)\s+([a-z]+)/i))) {
    const word = m[1].toLowerCase();
    const key = Object.keys(LINKS).find(k => k === word || LINKS[k].label.toLowerCase().split(" ").includes(word));
    if (key) { out.link = key; s = s.replace(m[0], " "); }
  }
  out.t = s.replace(/\s+/g, " ").trim();
  return out;
}
function showParsed(p) {
  const chips = [];
  if (p.due) chips.push(fmt(d(p.due)));
  if (p.time) chips.push(p.time);
  if (p.link) chips.push((LINKS[p.link].kind === "deal" ? "Deal: " : "Person: ") + LINKS[p.link].label);
  if (p.who) chips.push("Assignee: " + PEOPLE[p.who]);
  if (p.list) chips.push((p.newList ? "New list: " : "List: ") + p.list);
  if (p.p) chips.push(["", "Low", "Medium", "High"][p.p] + " priority");
  if (p.repeat) chips.push("↻ " + p.repeat);
  el("parsed").innerHTML = chips.map(c => `<span class="pchip">${esc(c)}</span>`).join("");
}

  if (p.list && !LISTS.includes(p.list)) LISTS.push(p.list);
  const list = p.list || (view.startsWith("list:") ? view.slice(5) : undefined);
  const repeat = p.repeat || (view === "recurring" ? "Weekly" : undefined);
  const t = { t: p.t, due: p.due || iso(TODAY), time: p.time, who: p.who || me, list, p: p.p || 0, repeat, kind: "task", done: false };
  if (p.link && HQ.contacts[p.link]) { t.s = "open"; HQ.contacts[p.link].tasks.push(t); t.link = p.link; } else { t.id = nextId++; own.push(t); }
  const k = catOf(t);
  toast(`Added "${t.t}" to ${catName(k)}, due ${fmt(d(t.due))}${view === "recurring" && !p.repeat ? ", repeats weekly (change it in the task)" : ""}${view === "clients" && !t.link ? '. No client matched. Use "re" + a name to link one' : ""}.`);
  render();
  const i = el("qa-input"); if (i) i.focus();
}

function saveNewList() {
  const i = el("nl-name"), n = i && i.value.trim();
  newListOpen = false;
  if (n && !LISTS.includes(n)) { LISTS.push(n); view = "list:" + n; toast(`Created "${n}". Add tasks here or type #${n.replace(/\s+/g, "")} in quick add.`); }
  render();
}
document.addEventListener("keydown", e => {
  if (e.target.id === "nl-name" && e.key === "Enter") { e.preventDefault(); saveNewList(); }
  if (e.target.id === "nl-name" && e.key === "Escape") { newListOpen = false; renderSide(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "who-q") { whoQ = e.target.value; const pos = e.target.selectionStart; renderMain(); const q = el("who-q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("click", e => { if (whoOpen && !e.target.closest(".who-dd")) { whoOpen = false; renderMain(); } });
/* ---------- Events ---------- */
let tt;
function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; gather();
  if ((b.dataset.open && b.dataset.open !== String(sel)) || b.dataset.close || b.dataset.view) { if (dr || (el("tsave") && !el("tsave").disabled)) { toast("Save or cancel your changes first."); const s = el("tsave"); if (s) s.focus(); return; } }
  if (b.dataset.view) { view = b.dataset.view; sel = null; render(); return; }
  if (b.dataset.newlist) { newListOpen = true; renderSide(); el("nl-name").focus(); return; }
  if (b.dataset.nlsave) { saveNewList(); return; }
  if (b.dataset.whotoggle) { whoOpen = !whoOpen; whoQ = ""; render(); const q = el("who-q"); if (q) q.focus(); return; }
  if (b.dataset.who) { whoF = b.dataset.who; whoOpen = false; render(); return; }
  if (b.id === "as-lp" || b.id === "as-as") {
    me = b.id === "as-lp" ? "LP" : "AS"; HQ.me = me;
    whoF = me === "LP" ? "everyone" : "me";
    el("as-lp").setAttribute("aria-pressed", me === "LP");
    el("as-as").setAttribute("aria-pressed", me === "AS");
    sel = null; render(); return;
  }
  if (b.dataset.arrange) { if (!arranging) arranging = { order: orderedKeys(), on: Object.fromEntries(orderedKeys().map(k => [k, showsOnToday(k)])), names: Object.fromEntries(LISTS.map(l => ["list:" + l, l])), deleted: [] }; view = "today"; sel = null; render(); return; }
  if (arranging) {
    const a = arranging, readNames = () => document.querySelectorAll("[data-arrname]").forEach(i => a.names[i.dataset.arrname] = i.value);
    if (b.dataset.arrup || b.dataset.arrdown) { readNames(); const i = +(b.dataset.arrup || b.dataset.arrdown), j = i + (b.dataset.arrup ? -1 : 1); [a.order[i], a.order[j]] = [a.order[j], a.order[i]]; renderMain(); return; }
    if (b.dataset.arrdel) { readNames(); a.order = a.order.filter(k => k !== b.dataset.arrdel); a.deleted.push(b.dataset.arrdel); renderMain(); return; }
    if (b.dataset.arradd) { readNames(); const n = el("arr-new").value.trim(); if (!n) { el("arr-new").focus(); return; } const k = "list:" + n; if (!a.order.includes(k)) { a.order.push(k); a.names[k] = n; a.on[k] = true; a.added = (a.added || []).concat(k); } renderMain(); el("arr-new").focus(); return; }
    if (b.dataset.arrcancel) { arranging = null; render(); return; }
    if (b.dataset.arrsave) {
      readNames(); gather();
      a.deleted.forEach(k => { const l = k.slice(5); LISTS = LISTS.filter(x => x !== l); tasks.forEach(t => { if (t.list === l) delete t.list; }); });
      (a.added || []).filter(k => a.order.includes(k)).forEach(k => { if (!LISTS.includes(k.slice(5))) LISTS.push(k.slice(5)); });
      const order = a.order.map(k => {
        if (!k.startsWith("list:")) return k;
        const old = k.slice(5), n = (a.names[k] || old).trim() || old;
        if (n !== old && !LISTS.includes(n)) { LISTS[LISTS.indexOf(old)] = n; tasks.forEach(t => { if (t.list === old) t.list = n; }); a.on["list:" + n] = a.on[k]; return "list:" + n; }
        return k;
      });
      ORDER = order; onToday = {}; order.forEach(k => { if (a.on[k] === false) onToday[k] = false; });
      arranging = null; render(); toast("Saved. The sidebar and Today columns use this order."); return;
    }
  }
  if (b.dataset.tsave) { saveTask(); return; }
  if (b.dataset.tcancel) { dr = null; renderDetail(); toast("Changes discarded."); return; }
  if (b.dataset.open) { sel = b.dataset.open; render(); return; }
  if (confirmDel && !b.dataset.deltask && !b.dataset.dellist) confirmDel = null;
  if (b.dataset.close) { sel = null; render(); return; }
  if (b.dataset.addsub) { const t0 = byId(sel), v = el("sub-new").value.trim(); if (!v) { el("sub-new").focus(); return; } dr = dr || {}; dr.subs = dr.subs || (t0.subs || []).map(x => x.slice()); dr.subs.push([v, false]); renderDetail(); el("sub-new").focus(); return; }
  if (b.dataset.deltask) { const id = b.dataset.deltask; if (confirmDel !== "task" + id) { confirmDel = "task" + id; renderDetail(); return; } delTask(byId(id)); sel = null; dr = null; confirmDel = null; render(); toast("Task deleted."); return; }
  if (b.dataset.renlist) { renamingList = true; renderMain(); const i = el("list-name"); i.focus(); i.select(); return; }
  if (b.dataset.savelist) { const old = view.slice(5), n = el("list-name").value.trim(); if (n && n !== old && !LISTS.includes(n)) { if (("list:" + old) in onToday) { onToday["list:" + n] = onToday["list:" + old]; delete onToday["list:" + old]; } ORDER = ORDER.map(k => k === "list:" + old ? "list:" + n : k); LISTS[LISTS.indexOf(old)] = n; gather(); tasks.forEach(t => { if (t.list === old) t.list = n; }); view = "list:" + n; } renamingList = false; render(); return; }
  if (b.dataset.dellist) { const l = view.slice(5); if (confirmDel !== "list") { confirmDel = "list"; renderMain(); return; } LISTS.splice(LISTS.indexOf(l), 1); delete onToday["list:" + l]; ORDER = ORDER.filter(k => k !== "list:" + l); gather(); tasks.forEach(t => { if (t.list === l) delete t.list; }); confirmDel = null; view = "today"; render(); toast(`Deleted "${l}". Its tasks are kept, just not in a list.`); return; }
  if (b.dataset.done) {
    const t = byId(b.dataset.done);
    t.done = !t.done; t.justDone = t.done;
    if (t.ref) t.ref.s = t.done ? "done" : "open"; else if (t.s) t.s = t.done ? "done" : "open";
    if (t.auto) dateDone[t.id] = t.done ? "just" : undefined;
    if (t.done && t.repeat) toast(`Done. Next one created (${t.repeat.toLowerCase()}).`);
    else if (t.done && t.step) toast(`Done. Also checked off on ${LINKS[t.link].label}'s ${t.step.file.toLowerCase()}.`);
    render(); return;
  }
  if (b.dataset.touch) { const p = touches[+b.dataset.touch]; HQ.contacts[p.cid].history.unshift([iso(TODAY), "call", "Touch logged from Tasks", me]); toast(`Touch logged for ${p.n}. Next one due in ${p.f}.`); render(); return; }
  if (b.dataset.toast) { toast(b.dataset.toast); return; }
});
document.addEventListener("change", e => {
  if (e.target.dataset.arron && arranging) { arranging.on[e.target.dataset.arron] = e.target.checked; return; }
  if (e.target.id === "list-ontoday") { const l = view.slice(5); onToday[view] = e.target.checked; toast(e.target.checked ? `"${l}" now has its own column on Today.` : `"${l}" is hidden from Today. Its tasks only show in the list.`); render(); return; }
  gather(); const t0 = byId(sel); if (!t0 || !e.target.closest("#detail")) return;
  const id = e.target.id, v = e.target.value, t = dr = dr || {};
  if (e.target.dataset.sub !== undefined) { t.subs = t.subs || (t0.subs || []).map(x => x.slice()); t.subs[+e.target.dataset.sub][1] = e.target.checked; renderDetail(); return; }
  if (id === "d-due" && v) t.due = v;
  if (id === "d-repeat") t.repeat = v || undefined;
  if (id === "d-p") t.p = +v;
  if (id === "d-who") t.who = v;
  if (id === "d-list") { if (v === "__new") { const n = "New list " + (LISTS.length + 1); LISTS.push(n); t.list = n; toast(`Created "${n}". Rename it from the sidebar later.`); } else t.list = v || undefined; }
  // Text boxes: keep the panel as is (re-drawing here would swallow a click on Save).
  if (id === "d-title") { t.t = v; armSave(); return; }
  if (id === "d-time") { t.time = v; armSave(); return; }
  if (id === "d-notes") { t.notes = v; armSave(); return; }
  renderDetail();
});

function armSave() { const b = el("tsave"); if (b) { b.disabled = false; b.textContent = "Save changes"; b.previousElementSibling.disabled = false; } }
document.addEventListener("input", e => { if (e.target.closest && e.target.closest("#detail") && e.target.id !== "sub-new") armSave(); });
function saveTask() {
  const t = byId(sel); if (!t) return;
  ["d-title", "d-time", "d-notes"].forEach(id => { const i = el(id); if (i && i.value !== (id === "d-title" ? t.t : id === "d-time" ? t.time || "" : t.notes || "")) { dr = dr || {}; dr[{ "d-title": "t", "d-time": "time", "d-notes": "notes" }[id]] = i.value; } });
  if (!dr) return;
  Object.assign(t, dr);
  if (t.ref) { if ("t" in dr) t.ref.t = dr.t; if ("who" in dr) t.ref.who = dr.who; }
  dr = null; render(); toast("Saved.");
}
// Tasks created elsewhere (e.g. a template applied on a contact page).
function drain() {
  if (typeof HQ === "undefined" || !HQ.newTasks.length) return 0;
  const n = HQ.newTasks.length;
  HQ.newTasks.splice(0).forEach(x => {
    const key = x.cid;
    own.push({ id: nextId++, t: x.t, due: x.due || iso(TODAY), who: x.who, link: key, p: 0, kind: "task", done: false });
  });
  return n;
}
drain();
render();
</script>
