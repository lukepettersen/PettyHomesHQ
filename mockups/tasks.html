<title>Tasks Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top nav; sidebar of smart views + flat lists | task list with quick add | detail panel when a task is open. Phones: sidebar becomes a chip row, detail becomes a full-screen sheet. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --sunken: #eaeef0;
  --line: #d8dee2;
  --fg: #16222a;
  --muted: #5b6b75;
  --accent: #1d6a85;
  --accent-soft: #dcecf2;
  --ok: #2f7a4b;
  --ok-soft: #e0f0e5;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3372b;
  --bad-soft: #f9e1de;
  --waive: #6b6480;
  --waive-soft: #ebe8f2;
  --p-high: #c2410c;
  --p-med: #b7860b;
  --p-low: #2f6fb3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
    --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
    --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
    --p-high: #fb923c; --p-med: #e2b04f; --p-low: #6aa8e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
  --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
  --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
  --p-high: #fb923c; --p-med: #e2b04f; --p-low: #6aa8e8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.mock-bar { background: var(--accent-soft); padding-block: 7px; padding-inline: 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.main-h .tools { display: flex; flex-wrap: wrap; gap: 8px; }
.topnav { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding-block: 12px; white-space: nowrap; }
.brand span { color: var(--accent); }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a { color: var(--muted); text-decoration: none; padding: 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav nav a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

.shell { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.shell.with-detail { grid-template-columns: 210px minmax(0, 1fr) 340px; }

/* Sidebar */
.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); }
.side h4 { margin: 0 0 4px; padding: 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav-i { width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nav-i:hover { background: var(--sunken); }
.nav-i[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-i .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-i .c.bad { color: var(--bad); font-weight: 600; }

/* Main */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.main-h { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vw, 28px); margin: 0; }
.main-h .sub { color: var(--muted); font-size: 13px; }
.filters { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.filters button { border: 0; background: none; padding: 4px 12px; font-size: 12.5px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

.qa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 6px 4px 12px; }
.qa:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.qa form { display: flex; gap: 8px; align-items: center; }
.qa input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; outline: none; }
.qa .add { border: 0; background: var(--accent); color: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.parsed { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 8px; }
.parsed:empty { display: none; }
.pchip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.qa-hint { font-size: 12px; color: var(--muted); padding: 0 2px; }
.qa-hint code { font-family: var(--font-data); font-size: 11.5px; background: var(--sunken); padding: 1px 4px; border-radius: 3px; }

.group { display: flex; flex-direction: column; }
.group h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; }
.group h3.bad { color: var(--bad); }
.group h3 span:last-child { font-weight: 500; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row.sel { background: var(--accent-soft); }
.check { width: 19px; height: 19px; border-radius: 5px; border: 1.8px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.check.p3 { border-color: var(--p-high); } .check.p2 { border-color: var(--p-med); } .check.p1 { border-color: var(--p-low); }
.row.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.body { border: 0; background: none; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.body .t { font-weight: 500; }
.row.done .body .t { color: var(--muted); text-decoration: line-through; }
.meta { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.link { color: var(--accent); font-weight: 600; }
.link.deal::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: currentColor; margin-right: 5px; vertical-align: 1px; }
.r { display: flex; align-items: center; gap: 8px; }
.due { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.due.overdue { color: var(--bad); font-weight: 500; }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
.av.as { background: var(--waive-soft); color: var(--waive); }
.empty { color: var(--muted); padding: 18px 14px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.touch-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; }

/* Detail */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; max-height: calc(100vh - 40px); overflow: auto; }
.detail-h { display: flex; gap: 10px; align-items: flex-start; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.detail-h .title { flex: 1; font-weight: 600; font-size: 15px; border: 0; background: none; padding: 0; resize: none; min-width: 0; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; }
.fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 10px; padding: 12px 14px; font-size: 13px; align-items: center; }
.fields label { color: var(--muted); font-weight: 600; font-size: 12px; }
.fields select, .fields input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.from { margin: 0 14px; padding: 10px 12px; border-radius: 6px; background: var(--sunken); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.from b { color: var(--fg); }
.from .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; border-radius: 6px; font-weight: 600; font-size: 12.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.sec { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.sec h5 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.sub-i { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.sub-i input { width: 15px; height: 15px; accent-color: var(--ok); }
.sub-i.done span { color: var(--muted); text-decoration: line-through; }
.notes { width: 100%; min-height: 70px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); resize: vertical; font-size: 13px; }

@media (max-width: 1080px) {
  .shell.with-detail { grid-template-columns: 210px minmax(0, 1fr); }
  .detail { position: fixed; inset: 0 0 0 auto; width: min(380px, 100%); max-height: none; border-radius: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -8px 0 24px rgb(0 0 0 / .15); }
}
@media (max-width: 760px) {
  .shell, .shell.with-detail { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .side h4 { display: none; }
  .side ul { flex-direction: row; gap: 6px; }
  .nav-i { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
  .row { grid-template-columns: 22px minmax(0, 1fr); }
  .row .r { grid-column: 2; }
}
.newlist { display: flex; gap: 6px; padding: 4px 0; }
.newlist input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.nav-i.addl { color: var(--accent); font-weight: 600; }
.listtag { background: var(--sunken); padding: 0 6px; border-radius: 4px; }
.who-dd { position: relative; }
.who-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13px; font-weight: 600; min-width: 150px; text-align: left; display: flex; justify-content: space-between; gap: 10px; }
.who-menu { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); width: 240px; z-index: 15; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.who-menu input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); margin-bottom: 4px; }
.who-opt { border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.who-opt:hover { background: var(--sunken); }
.who-opt[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }
.who-h { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 8px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
.linkbtn2 { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; margin-right: 10px; }
.linkbtn2.danger, .danger-btn { color: var(--bad); }
.list-acts { display: block; margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 30; }
</style>

<div class="mock-bar"><span><strong>Mockup</strong> · starts empty, "today" is Mon Oct 12, 2026. Try quick add, or type #listname to put a task in a list.</span>
  <span class="seg" role="group" aria-label="Viewing as" style="margin-left:12px"><button id="as-lp" aria-pressed="true">Viewing as Luke</button><button id="as-as" aria-pressed="false">Viewing as assistant</button></span></div>

<header class="topnav"><div class="brand">Petty Homes <span>HQ</span></div><nav aria-label="Main"><a href="people.html">People</a><a href="deals.html">Pipeline</a><a href="tasks.html" class="on">Tasks</a><a href="messages.html">Messages</a><a href="admin.html">Admin</a></nav></header>

<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
  <aside class="detail" id="detail" hidden></aside>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const TODAY = d("2026-10-12");
function d(s) { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); }
function iso(x) { return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
function add(x, n) { const y = new Date(x); y.setDate(y.getDate() + n); return y; }
function diff(a, b) { return Math.round((a - b) / 86400000); }
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], DOWL = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmt = x => DOW[x.getDay()] + " " + MON[x.getMonth()] + " " + x.getDate();
const short = x => MON[x.getMonth()] + " " + x.getDate();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const PEOPLE = Object.fromEntries(HQ.settings.team.map(([k, n]) => [k, n]));
// Links a task can point to. Deals match the pipeline mockup.
// Links point at the shared people (HQ.contacts); rebuilt on every render.
const LINKS = {}, CID = {};
function syncLinks() {
  Object.entries(HQ.contacts).forEach(([cid, c]) => { LINKS[cid] = { kind: "person", label: c.name, full: `${c.name} · ${c.stage}` }; CID[cid] = cid; });
  Object.keys(LINKS).forEach(k => { if (!HQ.contacts[k]) { delete LINKS[k]; delete CID[k]; } });
}

let tasks = []; // starts empty
let nextId = 0;

// People past their follow-up frequency.
let touches = [];
function syncTouches() {
  touches = Object.entries(HQ.contacts).filter(([, c]) => c.follow).map(([cid, c]) => {
    const last = c.history.filter(h => ["note", "text", "call", "email"].includes(h[1])).map(h => d(h[0])).sort((a, b) => b - a)[0];
    return { cid, n: c.name, f: c.follow + " days", last: last ? short(last) : "never", days: last ? diff(TODAY, last) : Infinity, follow: c.follow };
  }).filter(p => p.days >= p.follow);
}

let view = "today", filter = "all", sel = null, me = "LP", whoF = "everyone", whoOpen = false, whoQ = "";
const TEAM = HQ.settings.team;
const whoLabel = () => whoF === "everyone" ? "Everyone" : whoF === "me" ? "Me" : TEAM.find(t => t[0] === whoF)[1];
function whoMenu() {
  const opt = (k, l, av) => `<button class="who-opt" data-who="${k}" aria-pressed="${whoF === k}">${av ? `<span class="av ${av === "AS" ? "as" : ""}">${av}</span>` : ""}${l}</button>`;
  const team = TEAM.filter(([, n]) => n.toLowerCase().includes(whoQ.toLowerCase()));
  return `<span class="who-dd"><button class="who-btn" data-whotoggle="1" aria-expanded="${whoOpen}">${whoLabel()} <span aria-hidden="true">▾</span></button>
    ${whoOpen ? `<div class="who-menu"><input id="who-q" placeholder="Search" value="${esc(whoQ)}" aria-label="Search team">
      ${"everyone".includes(whoQ.toLowerCase()) ? opt("everyone", "Everyone") : ""}${"me".includes(whoQ.toLowerCase()) ? opt("me", "Me", me) : ""}
      <div class="who-h">Team members</div>${team.map(([k, n]) => opt(k, n, k)).join("")}</div>` : ""}</span>`;
}
let LISTS = [], newListOpen = false, confirmDel = null, renamingList = false;
const el = id => document.getElementById(id);

const VIEWS = [
  ["today", "Today"], ["tomorrow", "Tomorrow"], ["overdue", "Overdue"],
  ["touch", "Due for a touch"],
];
function inView(t, v) {
  const n = diff(d(t.due), TODAY);
  if (v === "today") return n <= 0;
  if (v === "tomorrow") return n === 1;
  if (v === "overdue") return n < 0;
  if (v === "recurring") return !!t.repeat;
  if (v.startsWith("list:")) return t.list === v.slice(5);
  return false;
}
const visible = v => tasks.filter(t => !t.done || t.justDone).filter(t => whoF === "everyone" || t.who === (whoF === "me" ? me : whoF)).filter(t => inView(t, v));
function applyFilter(list) {
  if (filter === "general") return list.filter(t => !t.step);
  if (filter === "deal") return list.filter(t => t.step);
  return list;
}
const sortT = (a, b) => d(a.due) - d(b.due) || (b.p - a.p) || ((a.time || "z") > (b.time || "z") ? 1 : -1);

function renderSide() {
  const cnt = v => v === "touch" ? touches.length : visible(v).filter(t => !t.done).length;
  const od = cnt("overdue");
  el("side").innerHTML = `
    <div><h4>Views</h4><ul>${VIEWS.map(([k, l]) => `<li><button class="nav-i" data-view="${k}" aria-current="${view === k}"><span>${l}</span><span class="c ${k === "overdue" && od ? "bad" : ""}">${cnt(k) || ""}</span></button></li>`).join("")}</ul></div>
    <div><h4>Lists</h4><ul><li><button class="nav-i" data-view="recurring" aria-current="${view === "recurring"}"><span>Recurring</span><span class="c">${cnt("recurring") || ""}</span></button></li>
      ${LISTS.map(l => `<li><button class="nav-i" data-view="list:${esc(l)}" aria-current="${view === "list:" + l}"><span>${esc(l)}</span><span class="c">${cnt("list:" + l) || ""}</span></button></li>`).join("")}
      <li>${newListOpen ? `<div class="newlist"><input id="nl-name" placeholder="List name" aria-label="New list name"><button class="btn primary" data-nlsave="1">Add</button></div>` : `<button class="nav-i addl" data-newlist="1"><span>+ New list</span></button>`}</li></ul></div>`;
}

function rowHtml(t) {
  const n = diff(d(t.due), TODAY);
  const L = t.link && LINKS[t.link];
  const meta = [];
  if (L) meta.push(`<span class="link ${L.kind}">${esc(L.label)}</span>`);
  if (t.subs) meta.push(`<span>☐ ${t.subs.filter(s => s[1]).length}/${t.subs.length}</span>`);
  if (t.repeat) meta.push(`<span>↻ ${t.repeat}</span>`);
  if (t.auto) meta.push(`<span class="listtag">From Important Dates</span>`);
  if (t.list && !view.startsWith("list:")) meta.push(`<span class="listtag">${esc(t.list)}</span>`);
  const dueTxt = (n === 0 ? "Today" : n === 1 ? "Tomorrow" : n < 0 ? short(d(t.due)) : fmt(d(t.due))) + (t.time ? " " + t.time : "");
  return `<div class="row ${t.done ? "done" : ""} ${sel === t.id ? "sel" : ""}">
    <button class="check p${t.p}" data-done="${t.id}" aria-label="Complete: ${esc(t.t)}">${t.done ? '<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}</button>
    <button class="body" data-open="${t.id}"><span class="t">${esc(t.t)}</span>${meta.length ? `<span class="meta">${meta.join("")}</span>` : ""}</button>
    <span class="r"><span class="due date ${n < 0 && !t.done ? "overdue" : ""}">${dueTxt}</span><span class="av ${t.who === "AS" ? "as" : ""}" title="${PEOPLE[t.who]}">${t.who}</span></span>
  </div>`;
}

function groupsFor(list) {
  if (view === "today") return [["Overdue", list.filter(t => diff(d(t.due), TODAY) < 0), true], ["Today", list.filter(t => diff(d(t.due), TODAY) === 0)]];
  if (view === "recurring") return [[null, list]];
  if (view.startsWith("list:")) {
    const b = n => list.filter(t => { const x = diff(d(t.due), TODAY); return n === "o" ? x < 0 : n === "t" ? x === 0 : n === "m" ? x === 1 : x > 1; });
    return [["Overdue", b("o"), true], ["Today", b("t")], ["Tomorrow", b("m")], ["Later", b("l")]];
  }
  return [[null, list]];
}

function renderMain() {
  const title = view === "recurring" ? "Recurring" : view.startsWith("list:") ? view.slice(5) : VIEWS.find(v => v[0] === view)[1];
  if (view === "touch") {
    el("main").innerHTML = `<div class="main-h"><div><h1>Due for a touch</h1><div class="sub">People past their follow-up frequency</div></div></div>
      <div class="list">${touches.map((p, i) => `<div class="row"><span></span><a class="body" href="deals.html#contact-${p.cid}" style="text-decoration:none;color:inherit"><span class="t">${esc(p.n)}</span><span class="meta"><span>Every ${p.f}</span><span>Last touch ${p.last}</span></span></a><span class="r"><button class="touch-btn" data-touch="${i}">Log touch</button></span></div>`).join("") || ""}</div>
      ${touches.length ? "" : `<div class="empty">${Object.values(HQ.contacts).some(c => c.follow) ? "Everyone is up to date." : "Set a follow-up frequency on a person and they'll show up here when they're due."}</div>`}`;
    return;
  }
  const list = applyFilter(visible(view)).sort(sortT);
  const open = list.filter(t => !t.done).length;
  const groups = groupsFor(list).filter(g => g[1].length);
  el("main").innerHTML = `
    <div class="main-h">
      <div>${view.startsWith("list:") && renamingList ? `<span class="newlist"><input id="list-name" value="${esc(title)}" aria-label="List name"><button class="btn primary" data-savelist="1">Save</button></span>` : `<h1>${esc(title)}</h1>`}${view.startsWith("list:") && !renamingList ? `<span class="list-acts"><button class="linkbtn2" data-renlist="1">Rename</button><button class="linkbtn2 danger" data-dellist="1">${confirmDel === "list" ? "Click again to delete list" : "Delete list"}</button></span>` : ""}<div class="sub">${view === "recurring" ? "Each one shows up in Today when it's due, then schedules the next" : view.startsWith("list:") ? open + " open · these also show in Today, Tomorrow and Overdue when they're due" : open + " open" + (view === "today" ? " · " + fmt(TODAY) : "")}</div></div>
      <span class="tools">${whoMenu()}
      <span class="filters" role="group" aria-label="Show">
        <button data-filter="all" aria-pressed="${filter === "all"}">All</button>
        <button data-filter="general" aria-pressed="${filter === "general"}">General</button>
        <button data-filter="deal" aria-pressed="${filter === "deal"}">Deal steps</button>
      </span></span>
    </div>
    <div class="qa">
      <form id="qa-form" autocomplete="off">
        <input id="qa-input" placeholder='Add a task, e.g. "call lender re Murphy Fri 9am" or "rent check every month"' aria-label="Quick add task">
        <button class="add" type="submit">Add</button>
      </form>
      <div class="parsed" id="parsed"></div>
    </div>
    ${groups.length ? groups.map(([h, items, bad]) => `<section class="group">${h ? `<h3 class="${bad ? "bad" : ""}"><span>${h}</span><span>${items.filter(t => !t.done).length}</span></h3>` : ""}<div class="list">${items.map(rowHtml).join("")}</div></section>`).join("") : `<div class="empty">${tasks.length ? "Nothing here. Enjoy it." : "No tasks yet. Type one in the box above, or apply a template from a person's page."}</div>`}`;
  const inp = el("qa-input");
  inp.addEventListener("input", () => showParsed(parse(inp.value)));
  el("qa-form").addEventListener("submit", e => { e.preventDefault(); addTask(inp.value); });
}

function renderDetail() {
  const box = el("detail"), shell = el("shell");
  const t = tasks.find(x => x.id === sel);
  if (!t) { box.hidden = true; shell.classList.remove("with-detail"); return; }
  box.hidden = false; shell.classList.add("with-detail");
  const L = t.link && LINKS[t.link];
  box.innerHTML = `
    <div class="detail-h">
      <button class="check p${t.p}" data-done="${t.id}" aria-label="Complete">${t.done ? "✓" : ""}</button>
      <textarea class="title" id="d-title" rows="2" aria-label="Title">${esc(t.t)}</textarea>
      <button class="x" data-close="1" aria-label="Close">×</button>
    </div>
    ${t.step ? `<div class="from" style="margin-top:12px">
      <span>From the <b>${esc(L.label)}</b> deal checklist · ${esc(t.step.phase)}</span>
      <span>Timing: ${esc(t.step.rule)}. Moves automatically if that date changes.</span>
      <span class="acts"><a class="btn" href="deals.html#contact-${CID[t.link]}" style="text-decoration:none">Open contact</a>${t.kind !== "task" ? `<button class="btn primary" data-toast="Opens a pre-filled ${t.kind} to review and send">Draft ${t.kind}</button>` : ""}</span>
    </div>` : ""}
    <div class="fields">
      <label for="d-due">Due</label><input type="date" id="d-due" value="${t.due}">
      <label for="d-time">Time</label><input id="d-time" value="${t.time || ""}" placeholder="None">
      <label for="d-repeat">Repeat</label><select id="d-repeat">${["", "Daily", "Weekly", "Monthly", "Yearly"].map(r => `<option value="${r}" ${t.repeat === r || (!t.repeat && !r) ? "selected" : ""}>${r || "Never"}</option>`).join("")}</select>
      <label for="d-list">List</label><select id="d-list"><option value="">None</option>${LISTS.map(l => `<option ${t.list === l ? "selected" : ""}>${esc(l)}</option>`).join("")}<option value="__new">+ New list…</option></select>
      <label for="d-p">Priority</label><select id="d-p">${["None", "Low", "Medium", "High"].map((p, i) => `<option value="${i}" ${t.p === i ? "selected" : ""}>${p}</option>`).join("")}</select>
      <label for="d-who">Assignee</label><select id="d-who">${Object.entries(PEOPLE).map(([k, v]) => `<option value="${k}" ${t.who === k ? "selected" : ""}>${v}</option>`).join("")}</select>
      <label>Linked to</label><span>${L ? `<a class="link ${L.kind}" href="deals.html#contact-${CID[t.link]}" style="text-decoration:none">${esc(L.full)}</a>` : `<span style="color:var(--muted)">Nothing (general task)</span>`}</span>
    </div>
    <div class="sec"><h5>Subtasks</h5>
      ${(t.subs || []).map((s, i) => `<label class="sub-i ${s[1] ? "done" : ""}"><input type="checkbox" data-sub="${i}" ${s[1] ? "checked" : ""}><span>${esc(s[0])}</span></label>`).join("") || `<span style="font-size:12.5px;color:var(--muted)">None yet</span>`}
      <div class="newlist"><input id="sub-new" placeholder="Add a subtask" aria-label="New subtask"><button class="btn" data-addsub="1">Add</button></div>
    </div>
    <div class="sec"><h5>Notes</h5><textarea class="notes" id="d-notes" placeholder="Add notes">${esc(t.notes || "")}</textarea></div>
    <div class="sec"><button class="btn danger-btn" data-deltask="${t.id}">${confirmDel === "task" + t.id ? "Click again to delete" : "Delete task"}</button></div>`;
}

function render() { syncLinks(); syncTouches(); if (sel !== null && !tasks.some(t => t.id === sel)) sel = null; renderSide(); renderMain(); renderDetail(); }

/* ---------- Quick add parsing ---------- */
function parse(text) {
  let s = " " + text + " ", out = {};
  const take = re => { const m = s.match(re); if (m) s = s.replace(m[0], " "); return m; };
  let m;
  if ((m = take(/\s(every\s+(day|week|month|year)|daily|weekly|monthly|yearly)\s/i))) {
    const w = m[1].toLowerCase(); out.repeat = { day: "Daily", daily: "Daily", week: "Weekly", weekly: "Weekly", month: "Monthly", monthly: "Monthly", year: "Yearly", yearly: "Yearly" }[m[2] ? m[2].toLowerCase() : w];
  }
  if ((m = take(/\s(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s/i))) out.time = `${+m[1]}:${m[2] || "00"}${m[3].toLowerCase()}`;
  if ((m = take(/\s(today|tonight)\s/i))) out.due = iso(TODAY);
  else if ((m = take(/\s(tomorrow|tmrw)\s/i))) out.due = iso(add(TODAY, 1));
  else if ((m = take(/\s(next week)\s/i))) out.due = iso(add(TODAY, 7));
  else if ((m = take(/\s(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(day|nesday|rsday|urday)?\s/i))) {
    const k = DOWL.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0, 3)));
    let n = (k - TODAY.getDay() + 7) % 7; if (n === 0) n = 7;
    out.due = iso(add(TODAY, n));
  }
  if ((m = take(/\s!(high|h|3|med|medium|m|2|low|l|1)\s/i))) out.p = { high: 3, h: 3, 3: 3, med: 2, medium: 2, m: 2, 2: 2, low: 1, l: 1, 1: 1 }[m[1].toLowerCase()];
  if ((m = take(/\s#([\w-]+)\s/))) { const l = LISTS.find(x => x.toLowerCase() === m[1].toLowerCase()); out.list = l || m[1][0].toUpperCase() + m[1].slice(1); out.newList = !l; }
  if ((m = take(/\s@(assistant|alyssa|luke|me)\s/i))) out.who = /luke|me/i.test(m[1]) ? "LP" : "AS";
  if ((m = s.match(/\s(?:re|for|with)\s+([a-z]+)/i))) {
    const word = m[1].toLowerCase();
    const key = Object.keys(LINKS).find(k => k === word || LINKS[k].label.toLowerCase().split(" ").includes(word));
    if (key) { out.link = key; s = s.replace(m[0], " "); }
  }
  out.t = s.replace(/\s+/g, " ").trim();
  return out;
}
function showParsed(p) {
  const chips = [];
  if (p.due) chips.push(fmt(d(p.due)));
  if (p.time) chips.push(p.time);
  if (p.link) chips.push((LINKS[p.link].kind === "deal" ? "Deal: " : "Person: ") + LINKS[p.link].label);
  if (p.who) chips.push("Assignee: " + PEOPLE[p.who]);
  if (p.list) chips.push((p.newList ? "New list: " : "List: ") + p.list);
  if (p.p) chips.push(["", "Low", "Medium", "High"][p.p] + " priority");
  if (p.repeat) chips.push("↻ " + p.repeat);
  el("parsed").innerHTML = chips.map(c => `<span class="pchip">${esc(c)}</span>`).join("");
}
function addTask(text) {
  const p = parse(text); if (!p.t) return;
  if (p.list && !LISTS.includes(p.list)) LISTS.push(p.list);
  const list = p.list || (view.startsWith("list:") ? view.slice(5) : undefined);
  const t = { id: nextId++, t: p.t, due: p.due || iso(TODAY), time: p.time, who: p.who || me, link: p.link, list, p: p.p || 0, repeat: p.repeat, kind: "task", done: false };
  tasks.push(t);
  toast(`Added "${t.t}" for ${fmt(d(t.due))}${inView(t, view) ? "" : ". It's in a different view."}`);
  render();
  const i = el("qa-input"); if (i) i.focus();
}

function saveNewList() {
  const i = el("nl-name"), n = i && i.value.trim();
  newListOpen = false;
  if (n && !LISTS.includes(n)) { LISTS.push(n); view = "list:" + n; toast(`Created "${n}". Add tasks here or type #${n.replace(/\s+/g, "")} in quick add.`); }
  render();
}
document.addEventListener("keydown", e => {
  if (e.target.id === "nl-name" && e.key === "Enter") { e.preventDefault(); saveNewList(); }
  if (e.target.id === "nl-name" && e.key === "Escape") { newListOpen = false; renderSide(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "who-q") { whoQ = e.target.value; const pos = e.target.selectionStart; renderMain(); const q = el("who-q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("click", e => { if (whoOpen && !e.target.closest(".who-dd")) { whoOpen = false; renderMain(); } });
/* ---------- Events ---------- */
let tt;
function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { view = b.dataset.view; sel = null; render(); return; }
  if (b.dataset.newlist) { newListOpen = true; renderSide(); el("nl-name").focus(); return; }
  if (b.dataset.nlsave) { saveNewList(); return; }
  if (b.dataset.filter) { filter = b.dataset.filter; render(); return; }
  if (b.dataset.whotoggle) { whoOpen = !whoOpen; whoQ = ""; render(); const q = el("who-q"); if (q) q.focus(); return; }
  if (b.dataset.who) { whoF = b.dataset.who; whoOpen = false; render(); return; }
  if (b.id === "as-lp" || b.id === "as-as") {
    me = b.id === "as-lp" ? "LP" : "AS";
    whoF = me === "LP" ? "everyone" : "me";
    el("as-lp").setAttribute("aria-pressed", me === "LP");
    el("as-as").setAttribute("aria-pressed", me === "AS");
    sel = null; render(); return;
  }
  if (b.dataset.open) { sel = +b.dataset.open; render(); return; }
  if (confirmDel && !b.dataset.deltask && !b.dataset.dellist) confirmDel = null;
  if (b.dataset.close) { sel = null; render(); return; }
  if (b.dataset.addsub) { const t = tasks.find(x => x.id === sel), v = el("sub-new").value.trim(); if (!v) { el("sub-new").focus(); return; } (t.subs = t.subs || []).push([v, false]); render(); el("sub-new").focus(); return; }
  if (b.dataset.deltask) { const id = +b.dataset.deltask; if (confirmDel !== "task" + id) { confirmDel = "task" + id; renderDetail(); return; } tasks = tasks.filter(x => x.id !== id); sel = null; confirmDel = null; render(); toast("Task deleted."); return; }
  if (b.dataset.renlist) { renamingList = true; renderMain(); const i = el("list-name"); i.focus(); i.select(); return; }
  if (b.dataset.savelist) { const old = view.slice(5), n = el("list-name").value.trim(); if (n && n !== old && !LISTS.includes(n)) { LISTS[LISTS.indexOf(old)] = n; tasks.forEach(t => { if (t.list === old) t.list = n; }); view = "list:" + n; } renamingList = false; render(); return; }
  if (b.dataset.dellist) { const l = view.slice(5); if (confirmDel !== "list") { confirmDel = "list"; renderMain(); return; } LISTS.splice(LISTS.indexOf(l), 1); tasks.forEach(t => { if (t.list === l) delete t.list; }); confirmDel = null; view = "today"; render(); toast(`Deleted "${l}". Its tasks are kept, just not in a list.`); return; }
  if (b.dataset.done) {
    const t = tasks.find(x => x.id === +b.dataset.done);
    t.done = !t.done; t.justDone = t.done;
    if (t.done && t.repeat) toast(`Done. Next one created (${t.repeat.toLowerCase()}).`);
    else if (t.done && t.step) toast(`Done. Also checked off on the ${LINKS[t.link].label} checklist and logged to the timeline.`);
    render(); return;
  }
  if (b.dataset.touch) { const p = touches[+b.dataset.touch]; HQ.contacts[p.cid].history.unshift([iso(TODAY), "call", "Touch logged from Tasks", me]); toast(`Touch logged for ${p.n}. Next one due in ${p.f}.`); render(); return; }
  if (b.dataset.toast) { toast(b.dataset.toast); return; }
});
document.addEventListener("change", e => {
  const t = tasks.find(x => x.id === sel); if (!t) return;
  const id = e.target.id, v = e.target.value;
  if (e.target.dataset.sub !== undefined) { t.subs[+e.target.dataset.sub][1] = e.target.checked; render(); return; }
  if (id === "d-due" && v) t.due = v;
  if (id === "d-time") t.time = v;
  if (id === "d-repeat") t.repeat = v || undefined;
  if (id === "d-p") t.p = +v;
  if (id === "d-who") t.who = v;
  if (id === "d-list") { if (v === "__new") { const n = "New list " + (LISTS.length + 1); LISTS.push(n); t.list = n; toast(`Created "${n}". Rename it from the sidebar later.`); } else t.list = v || undefined; }
  if (id === "d-list") t.list = v || undefined;
  if (id === "d-title") t.t = v;
  if (id === "d-notes") { t.notes = v; return; }
  render();
});

// Tasks created elsewhere (e.g. a template applied on a contact page).
function drain() {
  if (typeof HQ === "undefined" || !HQ.newTasks.length) return 0;
  const n = HQ.newTasks.length;
  HQ.newTasks.splice(0).forEach(x => {
    const key = x.cid;
    tasks.push({ id: nextId++, t: x.t, due: x.due || iso(TODAY), who: x.who, link: key, p: 0, kind: "task", done: false });
  });
  return n;
}
drain();
render();
</script>
