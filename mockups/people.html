<title>People Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f6f7; --surface: #ffffff; --sunken: #eaeef0; --line: #d8dee2; --fg: #16222a; --muted: #5b6b75;
  --accent: #1d6a85; --accent-soft: #dcecf2; --ok: #2f7a4b; --ok-soft: #e0f0e5; --warn: #9a6400; --warn-soft: #fbefd6;
  --bad: #b3372b; --bad-soft: #f9e1de; --waive: #6b6480; --waive-soft: #ebe8f2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
    --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
  --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.mock-bar { background: var(--accent-soft); padding-block: 7px; padding-inline: 16px; font-size: 13px; }
.topnav { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding-block: 12px; white-space: nowrap; }
.brand span { color: var(--accent); }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a { color: var(--muted); text-decoration: none; padding: 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav nav a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.15; margin: 0; }
.muted { color: var(--muted); } .sm { font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; }
.tagchip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.side-nav { display: flex; flex-direction: column; gap: 12px; }
.side-nav h4 { margin: 0 0 4px; padding: 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.side-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav-i { width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.nav-i:hover { background: var(--sunken); }
.nav-i[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-i .c { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 40; }
@media (max-width: 760px) {
  .side-nav { flex-direction: row; overflow-x: auto; }
  .side-nav h4 { display: none; }
  .side-nav ul { flex-direction: row; gap: 6px; }
  .nav-i { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
}
</style>
<style>
/* Layout: collections (folders of smart lists) on the left; table with a filter bar on the right. */
.shell { max-width: 1500px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }
.main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.coll-nav { display: flex; flex-direction: column; gap: 2px; }
.ni { width: 100%; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ni:hover { background: var(--sunken); }
.ni[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ni .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.coll { margin-top: 6px; }
.coll-h { display: flex; align-items: center; gap: 2px; }
.coll-h .tog { flex: 1; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 6px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.coll-h .tog:hover { background: var(--sunken); }
.coll-h .tog::before { content: "▸"; font-size: 11px; color: var(--muted); width: 10px; transition: transform .15s; }
.coll-h .tog[aria-expanded="true"]::before { transform: rotate(90deg); }
.coll-h .mini { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 2px 6px; border-radius: 5px; line-height: 1; }
.coll-h .mini:hover { background: var(--sunken); color: var(--fg); }
.coll-body { padding-left: 14px; display: flex; flex-direction: column; gap: 1px; }
.coll-menu { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px 6px 22px; }
.coll-menu button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; font-size: 12px; padding: 2px 8px; }
.coll-menu input { flex: 1; min-width: 0; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; font-size: 13px; background: var(--surface); }
.addlink { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 5px 10px; text-align: left; }
.newcoll { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 860px) { .coll-nav { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; } }

.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.bar .l { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.crumb { font-size: 12.5px; color: var(--muted); }
.search { max-width: 300px; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fchip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--fg); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; }
.fchip b { font-weight: 600; }
.fchip button { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 5px; line-height: 1; border-radius: 999px; }
.fchip button:hover { color: var(--bad); }
.f-add { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.f-none { font-size: 12.5px; color: var(--muted); }
.builder { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; padding-top: 6px; border-top: 1px solid var(--line); margin-top: 2px; }
.builder select, .builder input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; }
.builder input { width: 90px; }
.f-actions { margin-left: auto; display: flex; gap: 6px; }
.tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:hover td { background: var(--bg); }
td a.name { color: var(--fg); font-weight: 600; text-decoration: none; }
td a.name:hover { color: var(--accent); }
.due { color: var(--bad); font-weight: 600; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.bulk { background: var(--fg); color: var(--surface); border-radius: var(--r); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bulk button { border: 1px solid rgb(255 255 255 / .3); background: none; color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 13px; }
.linkbtn2 { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; }
.linkbtn2.danger { color: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal { background: var(--surface); border-radius: 10px; padding: 18px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; }
.modal h2 { margin: 0; font-family: var(--font-display); font-size: 18px; }
.modal label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 6px; }
.modal p { margin: 0; font-size: 13px; color: var(--muted); }
</style>
<div class="mock-bar"><strong>Mockup</strong> · starts empty. Collections hold smart lists. Open a collection, pick a list, change its filters, then save.</div>
<header class="topnav"><div class="brand">Petty Homes <span>HQ</span></div><nav aria-label="Main"><a href="people.html" class="on">People</a><a href="deals.html">Pipeline</a><a href="tasks.html">Tasks</a><a href="messages.html">Messages</a><a href="admin.html">Admin</a></nav></header>
<div class="shell">
  <aside class="coll-nav" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// [cid, name, stage, followDays, lastTouchDaysAgo, source, tags, deal, phone]
// Rows come from the shared people (HQ.contacts) and client files (HQ.files). Starts empty.
const TODAY = new Date(2026, 9, 12);
let people = [];
function loadPeople() {
  people = Object.entries(HQ.contacts).map(([cid, c]) => {
    const touches = c.history.filter(h => ["note", "text", "call", "email"].includes(h[1])).map(h => new Date(h[0] + "T00:00"));
    const lastD = touches.sort((a, b) => b - a)[0];
    const files = HQ.files.filter(f => f.cid === cid && f.status !== "Closed" && f.status !== "Terminated");
    const uc = files.some(f => f.kind === "pa" && f.status === "Active");
    const buyer = files.find(f => f.kind === "buyer"), listing = files.find(f => f.kind === "listing");
    const deal = [buyer && `Buyer · ${uc && HQ.files.some(f => f.kind === "pa" && f.parent === buyer.id && f.status === "Active") ? "Under contract" : buyer.status}`, listing && `Seller · ${HQ.files.some(f => f.kind === "pa" && f.parent === listing.id && f.status === "Active") ? "Under contract" : listing.status}`].filter(Boolean).join(", ");
    return { cid, name: c.name, stage: c.stage, follow: c.follow, last: lastD ? Math.round((TODAY - lastD) / 86400000) : null, source: c.source || "—", tags: c.tags, deal,
      phone: (c.phones[0] || [])[1] || "", assigned: c.assigned || "Luke Pettersen",
      dealStatus: uc ? "Under contract" : buyer ? "Active buyer" : listing ? "Active seller" : "No active deal" };
  });
}

/* ---------- Filters ---------- */
const STAGES = HQ.settings.stages;
const uniq = a => [...new Set(a)].sort();
const FIELDS = {
  stage: { label: "Stage", ops: ["is", "is not"], values: () => STAGES },
  tag: { label: "Tag", ops: ["has", "doesn't have"], values: () => HQ.settings.tags },
  source: { label: "Source", ops: ["is", "is not"], values: () => HQ.settings.sources },
  deal: { label: "Deal", ops: ["is", "is not"], values: () => ["Under contract", "Active buyer", "Active seller", "No active deal"] },
  follow: { label: "Follow-up", ops: ["is"], values: () => HQ.settings.follow.map(n => `Every ${n} days`).concat(["Not set"]) },
  last: { label: "Last contact", ops: ["more than", "less than"], number: "days ago" },
  due: { label: "Due for a touch", ops: ["is"], values: () => ["Yes", "No"] },
  assigned: { label: "Assigned to", ops: ["is", "is not"], values: () => HQ.settings.team.map(t => t[1]) },
};
function test(p, { f, op, v }) {
  const neg = op === "is not" || op === "doesn't have";
  let hit;
  if (f === "stage") hit = p.stage === v;
  if (f === "tag") hit = p.tags.includes(v);
  if (f === "source") hit = p.source === v;
  if (f === "deal") hit = p.dealStatus === v;
  if (f === "follow") hit = v === "Not set" ? !p.follow : p.follow === +v.match(/\d+/)[0];
  if (f === "last") return p.last === null ? op === "more than" : op === "more than" ? p.last > +v : p.last < +v;
  if (f === "due") hit = (!!p.follow && (p.last === null || p.last >= p.follow)) === (v === "Yes");
  if (f === "assigned") hit = p.assigned === v;
  return neg ? !hit : hit;
}
const fText = ({ f, op, v }) => `<b>${FIELDS[f].label}</b> ${op} <b>${esc(v)}${FIELDS[f].number ? " " + FIELDS[f].number : ""}</b>`;

/* ---------- Collections & smart lists ---------- */
let nid = 100;
const L = (name, filters) => ({ id: "l" + (++nid), name, filters });
let collections = [
  { id: "c1", name: "Clear Daily", open: false, lists: [L("Buyers under contract", [{ f: "deal", op: "is", v: "Under contract" }, { f: "tag", op: "has", v: "Buyer" }]), L("Sellers under contract", [{ f: "deal", op: "is", v: "Under contract" }, { f: "tag", op: "has", v: "Seller" }]), L("A leads", [{ f: "tag", op: "has", v: "A Lead" }])] },
  { id: "c2", name: "Sphere", open: true, lists: [L("Past clients", [{ f: "stage", op: "is", v: "Past Client" }]), L("Sphere", [{ f: "stage", op: "is", v: "Sphere" }]), L("Due for a touch", [{ f: "due", op: "is", v: "Yes" }]), L("30 day sphere", [{ f: "follow", op: "is", v: "Every 30 days" }]), L("90 day sphere", [{ f: "follow", op: "is", v: "Every 90 days" }]), L("180 day sphere", [{ f: "follow", op: "is", v: "Every 180 days" }])] },
  { id: "c3", name: "Leads", open: false, lists: [L("Buyers not under contract", [{ f: "deal", op: "is", v: "Active buyer" }]), L("Sellers not under contract", [{ f: "deal", op: "is", v: "Active seller" }]), L("Website leads", [{ f: "source", op: "is", v: "Website" }]), L("Zillow leads", [{ f: "source", op: "is", v: "Zillow Preferred" }]), L("Gone quiet (60+ days)", [{ f: "stage", op: "is", v: "Lead" }, { f: "last", op: "more than", v: "60" }])] },
  { id: "c4", name: "Mailing Lists", open: false, lists: [L("Past client mailers", [{ f: "stage", op: "is", v: "Past Client" }, { f: "tag", op: "has", v: "Mailers" }]), L("Christmas cards", [{ f: "tag", op: "has", v: "Christmas Cards" }]), L("Email newsletter", [{ f: "tag", op: "has", v: "Email Newsletter" }])] },
  { id: "c5", name: "Partners", open: false, lists: [L("Industry partners", [{ f: "stage", op: "is", v: "Industry Partners" }])] },
];
let cur = null, renaming = false, confirmDel = null;           // current list id, null = All people
let working = [];         // filters being shown (may differ from the saved list)
let building = false, collMenu = null, q = "", sort = "name", sel = new Set();
const el = id => document.getElementById(id);
const findList = id => { for (const c of collections) { const l = c.lists.find(x => x.id === id); if (l) return [c, l]; } return [null, null]; };
const match = fs => people.filter(p => fs.every(f => test(p, f)));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function openList(id) {
  cur = id; building = false; sel.clear();
  working = id ? JSON.parse(JSON.stringify(findList(id)[1].filters)) : [];
  render();
}

function renderSide() {
  el("side").innerHTML = `
    <button class="ni" data-open="" aria-current="${cur === null}"><span>All people</span><span class="c">${people.length}</span></button>
    ${collections.map(c => `<div class="coll">
      <div class="coll-h">
        <button class="tog" data-tog="${c.id}" aria-expanded="${c.open}">${esc(c.name)}</button>
        <button class="mini" data-newlist="${c.id}" title="New smart list in ${esc(c.name)}" aria-label="New smart list in ${esc(c.name)}">+</button>
        <button class="mini" data-cmenu="${c.id}" aria-label="Collection options">⋯</button>
      </div>
      ${collMenu === c.id ? `<div class="coll-menu"><input id="rename-c" value="${esc(c.name)}" aria-label="Collection name"><button data-crename="${c.id}">Rename</button><button data-cdel="${c.id}">Delete</button></div>` : ""}
      ${c.open ? `<div class="coll-body">${c.lists.map(l => `<button class="ni" data-open="${l.id}" aria-current="${cur === l.id}"><span>${esc(l.name)}</span><span class="c">${match(l.filters).length}</span></button>`).join("")}
        <button class="addlink" data-newlist="${c.id}">+ New smart list</button></div>` : ""}
    </div>`).join("")}
    <div class="newcoll"><button class="addlink" data-newcoll="1">+ New collection</button></div>`;
}

function rows() {
  let r = match(working);
  if (q) { const s = q.toLowerCase(); r = r.filter(p => [p.name, p.phone, p.stage, p.source, p.deal, ...p.tags].join(" ").toLowerCase().includes(s)); }
  r.sort(sort === "name" ? (a, b) => a.name.localeCompare(b.name) : sort === "last" ? (a, b) => (b.last ?? 1e9) - (a.last ?? 1e9) : (a, b) => a.stage.localeCompare(b.stage));
  return r;
}

function builderHtml() {
  const f = el("b-field") ? el("b-field").value : "stage";
  const F = FIELDS[f];
  return `<div class="builder">
    <select id="b-field" aria-label="Field">${Object.entries(FIELDS).map(([k, x]) => `<option value="${k}" ${k === f ? "selected" : ""}>${x.label}</option>`).join("")}</select>
    <select id="b-op" aria-label="Condition">${F.ops.map(o => `<option>${o}</option>`).join("")}</select>
    ${F.number ? `<input id="b-val" type="number" value="30" aria-label="Days"> <span class="muted sm">${F.number}</span>` : `<select id="b-val" aria-label="Value">${F.values().map(v => `<option>${esc(v)}</option>`).join("")}</select>`}
    <button class="btn primary" data-addf="1">Add filter</button><button class="btn" data-cancelb="1">Cancel</button>
  </div>`;
}

function renderMain() {
  const [coll, list] = cur ? findList(cur) : [null, null];
  const r = rows();
  const changed = list ? !same(working, list.filters) : working.length > 0;
  el("main").innerHTML = `
    <div class="bar"><div class="l">${coll ? `<span class="crumb">${esc(coll.name)} ›</span>` : ""}${renaming && list ? `<input class="input" id="list-name" value="${esc(list.name)}" style="max-width:260px" aria-label="List name"><button class="btn primary" data-lrsave="1">Save</button>` : `<h1>${list ? esc(list.name) : "All people"}</h1>`}<span class="muted">${r.length} people</span>
      ${list && !renaming ? `<button class="linkbtn2" data-lrename="1">Rename</button><button class="linkbtn2 danger" data-ldel="1">${confirmDel === "list" ? "Click again to delete list" : "Delete list"}</button>` : ""}</div>
      <div style="display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:240px"><input class="input search" id="q" placeholder="Search name, phone, tag…" value="${esc(q)}" aria-label="Search people"><button class="btn primary" data-add="1">+ Add person</button></div></div>
    <div class="filters">
      ${working.length ? working.map((f, i) => `<span class="fchip">${fText(f)}<button data-rmf="${i}" aria-label="Remove filter">×</button></span>`).join("") : `<span class="f-none">No filters. Showing everyone.</span>`}
      ${building ? "" : `<button class="f-add" data-build="1">+ Add filter</button>`}
      ${changed ? `<span class="f-actions">${list ? `<button class="btn" data-revert="1">Reset</button><button class="btn" data-saveas="1">Save as new list</button><button class="btn primary" data-savelist="1">Save changes</button>` : `<button class="btn" data-revert="1">Clear</button><button class="btn primary" data-saveas="1">Save as smart list</button>`}</span>` : ""}
      ${building ? builderHtml() : ""}
    </div>
    ${sel.size ? `<div class="bulk"><b>${sel.size} selected</b><button data-toast="Add a tag to ${sel.size} people">Add tag</button><button data-toast="Change stage for ${sel.size} people">Change stage</button><button data-toast="Set follow-up for ${sel.size} people">Set follow-up</button><button data-toast="Assign ${sel.size} people">Assign</button><button data-toast="Download a CSV of ${sel.size} people">Export</button><button data-delsel="1">${confirmDel === "people" ? "Click again to delete " + sel.size : "Delete"}</button><button data-clear="1">Clear</button></div>` : ""}
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:30px"><input type="checkbox" id="all" aria-label="Select all" ${r.length && r.every(p => sel.has(p.cid)) ? "checked" : ""}></th>
        <th><button data-sort="name">Name${sort === "name" ? " ↓" : ""}</button></th><th><button data-sort="stage">Stage${sort === "stage" ? " ↓" : ""}</button></th>
        <th><button data-sort="last">Last contact${sort === "last" ? " ↓" : ""}</button></th><th>Follow up</th><th>Deal</th><th>Tags</th><th>Source</th></tr></thead>
      <tbody>${r.map(p => `<tr>
        <td><input type="checkbox" data-sel="${p.cid}" ${sel.has(p.cid) ? "checked" : ""} aria-label="Select ${esc(p.name)}"></td>
        <td><a class="name" href="deals.html#contact-${p.cid}">${esc(p.name)}</a><div class="muted sm num">${p.phone}</div></td>
        <td>${esc(p.stage)}</td>
        <td class="${p.follow && (p.last === null || p.last >= p.follow) ? "due" : ""}">${p.last === null ? "Never" : p.last === 0 ? "Today" : p.last === 1 ? "Yesterday" : p.last + " days ago"}</td>
        <td>${p.follow ? `Every ${p.follow}d` : `<span class="muted">—</span>`}</td>
        <td>${p.deal ? `<span class="sm">${esc(p.deal)}</span>` : `<span class="muted">—</span>`}</td>
        <td><div class="tags">${p.tags.slice(0, 2).map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}${p.tags.length > 2 ? `<span class="muted sm">+${p.tags.length - 2}</span>` : ""}</div></td>
        <td class="muted">${esc(p.source)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">${Object.keys(HQ.contacts).length ? "No one matches these filters." : "No people yet. Click + Add person to add your first contact."}</td></tr>`}</tbody>
    </table></div>`;
  const qi = el("q"); qi.addEventListener("input", () => { q = qi.value; const pos = qi.selectionStart; renderMain(); const n = el("q"); n.focus(); n.setSelectionRange(pos, pos); });
}
function render() { loadPeople(); renderSide(); renderMain(); }

/* ---------- Modals ---------- */
function saveModal(defaultColl) {
  el("modal").innerHTML = `<div class="modal-bg" data-close="1"><form class="modal" id="save-form" autocomplete="off">
    <h2>Save smart list</h2>
    <p>${working.map(f => fText(f).replace(/<\/?b>/g, "")).join(" and ") || "Everyone"}</p>
    <label>List name<input class="input" id="s-name" required placeholder="e.g. Past clients in Edina"></label>
    <label>Collection<select class="input" id="s-coll">${collections.map(c => `<option value="${c.id}" ${c.id === defaultColl ? "selected" : ""}>${esc(c.name)}</option>`).join("")}<option value="__new">+ New collection…</option></select></label>
    <label id="s-new-wrap" hidden>New collection name<input class="input" id="s-new"></label>
    <div class="foot"><button type="button" class="btn" data-close="1">Cancel</button><button class="btn primary" type="submit">Save list</button></div>
  </form></div>`;
  el("s-name").focus();
  el("s-coll").addEventListener("change", e => { el("s-new-wrap").hidden = e.target.value !== "__new"; });
  el("save-form").addEventListener("submit", e => {
    e.preventDefault();
    let cid = el("s-coll").value;
    if (cid === "__new") { const n = el("s-new").value.trim() || "New collection"; cid = "c" + (++nid); collections.push({ id: cid, name: n, open: true, lists: [] }); }
    const c = collections.find(x => x.id === cid); c.open = true;
    const l = L(el("s-name").value.trim(), JSON.parse(JSON.stringify(working)));
    c.lists.push(l); el("modal").innerHTML = ""; toast(`Saved "${l.name}" in ${c.name}.`); openList(l.id);
  });
}
function personModal() {
  el("modal").innerHTML = `<div class="modal-bg" data-close="1"><form class="modal" id="add-form" autocomplete="off">
    <h2>Add person</h2>
    <div class="two"><label>First name<input class="input" id="f-first" required></label><label>Last name<input class="input" id="f-last"></label></div>
    <div class="two"><label>Phone<input class="input" id="f-phone"></label><label>Email<input class="input" id="f-email"></label></div>
    <div id="p2" hidden>
      <p style="margin:4px 0 6px;font-weight:600;color:var(--fg)">Second person</p>
      <div class="two"><label>First name<input class="input" id="g-first"></label><label>Last name<input class="input" id="g-last" placeholder="Leave blank if the same"></label></div>
      <div class="two"><label>Phone<input class="input" id="g-phone"></label><label>Email<input class="input" id="g-email"></label></div>
    </div>
    <button type="button" class="btn" id="p2-toggle" data-p2="1">+ Add a second person (spouse, partner, co-buyer)</button>
    <p id="p-preview"></p>
    <div class="two"><label>Stage<select class="input" id="f-stage">${STAGES.map(s => `<option ${s === "Lead" ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    <label>Source<select class="input" id="f-source">${HQ.settings.sources.map(s => `<option>${esc(s)}</option>`).join("")}</select></label></div>
    <div class="foot"><button type="button" class="btn" data-close="1">Cancel</button><button class="btn primary" type="submit">Add</button></div>
  </form></div>`;
  el("f-first").focus();
  const v = id => el(id).value.trim();
  const display = () => {
    const a = [v("f-first"), v("f-last")].filter(Boolean).join(" ");
    if (el("p2").hidden || !v("g-first")) return a;
    const gl = v("g-last") || v("f-last");
    return gl === v("f-last") ? `${v("f-first")} & ${v("g-first")} ${gl}`.trim() : `${a} & ${v("g-first")} ${gl}`;
  };
  const preview = () => { el("p-preview").textContent = !el("p2").hidden && v("g-first") ? `Shows as "${display()}". Both names, phones and emails are searchable, and texts from either phone land on this contact.` : ""; };
  el("add-form").addEventListener("input", preview);
  el("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = display(), two = !el("p2").hidden && v("g-first");
    const phones = [], emails = [];
    if (v("f-phone")) phones.push([two ? v("f-first") : "Mobile", v("f-phone")]);
    if (v("f-email")) emails.push([two ? v("f-first") : "", v("f-email")]);
    if (two && v("g-phone")) phones.push([v("g-first"), v("g-phone")]);
    if (two && v("g-email")) emails.push([v("g-first"), v("g-email")]);
    HQ.newContact(name, { stage: el("f-stage").value, source: el("f-source").value, phones, emails });
    el("modal").innerHTML = ""; toast(`Added ${name}.`); render();
  });
}
let tt; function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }

document.addEventListener("click", e => {
  const b = e.target.closest("button, .modal-bg"); if (!b) return; const ds = b.dataset;
  if (ds.close !== undefined && (e.target === b || b.tagName === "BUTTON")) { el("modal").innerHTML = ""; return; }
  if (ds.open !== undefined) { openList(ds.open || null); return; }
  if (ds.tog) { const c = collections.find(x => x.id === ds.tog); c.open = !c.open; renderSide(); return; }
  if (ds.newlist) { const c = collections.find(x => x.id === ds.newlist); c.open = true; cur = null; working = []; building = true; render(); saveTarget = c.id; toast(`Add filters, then "Save as smart list" to put it in ${c.name}.`); return; }
  if (ds.cmenu) { collMenu = collMenu === ds.cmenu ? null : ds.cmenu; renderSide(); return; }
  if (ds.crename) { const c = collections.find(x => x.id === ds.crename); c.name = el("rename-c").value.trim() || c.name; collMenu = null; render(); return; }
  if (ds.cdel) { const c = collections.find(x => x.id === ds.cdel); if (c.lists.length) { toast(`Move or delete the ${c.lists.length} lists in ${c.name} first.`); return; } collections = collections.filter(x => x !== c); collMenu = null; render(); return; }
  if (ds.newcoll) { const c = { id: "c" + (++nid), name: "New collection", open: true, lists: [] }; collections.push(c); collMenu = c.id; renderSide(); const i = el("rename-c"); if (i) { i.focus(); i.select(); } return; }
  if (confirmDel && !ds.ldel && !ds.delsel) confirmDel = null;
  if (ds.lrename) { renaming = true; renderMain(); const i = el("list-name"); i.focus(); i.select(); return; }
  if (ds.lrsave) { const [, l] = findList(cur); l.name = el("list-name").value.trim() || l.name; renaming = false; render(); return; }
  if (ds.ldel) { if (confirmDel !== "list") { confirmDel = "list"; renderMain(); return; } const [c, l] = findList(cur); c.lists = c.lists.filter(x => x !== l); confirmDel = null; toast(`Deleted "${l.name}".`); openList(null); return; }
  if (ds.delsel) { if (confirmDel !== "people") { confirmDel = "people"; renderMain(); return; } const n = sel.size; sel.forEach(cid => HQ.deleteContact(cid)); sel.clear(); confirmDel = null; render(); toast(`Deleted ${n} ${n === 1 ? "person" : "people"}.`); return; }
  if (ds.build) { building = true; renderMain(); return; }
  if (ds.cancelb) { building = false; renderMain(); return; }
  if (ds.addf) { working.push({ f: el("b-field").value, op: el("b-op").value, v: el("b-val").value }); building = false; renderMain(); return; }
  if (ds.rmf) { working.splice(+ds.rmf, 1); renderMain(); return; }
  if (ds.revert) { working = cur ? JSON.parse(JSON.stringify(findList(cur)[1].filters)) : []; renderMain(); return; }
  if (ds.savelist) { const [, l] = findList(cur); l.filters = JSON.parse(JSON.stringify(working)); toast(`Saved "${l.name}".`); render(); return; }
  if (ds.saveas) { saveModal(saveTarget || (cur ? findList(cur)[0].id : collections[0].id)); return; }
  if (ds.sort) { sort = ds.sort; renderMain(); return; }
  if (ds.add) { personModal(); return; }
  if (ds.p2) { el("p2").hidden = false; b.remove(); el("g-first").focus(); return; }
  if (ds.clear) { sel.clear(); renderMain(); return; }
  if (ds.toast) { toast(ds.toast); return; }
});
let saveTarget = null;
document.addEventListener("change", e => {
  if (e.target.id === "b-field") { renderMain(); return; }
  if (e.target.dataset.sel) { const k = e.target.dataset.sel; e.target.checked ? sel.add(k) : sel.delete(k); renderMain(); }
  if (e.target.id === "all") { rows().forEach(p => e.target.checked ? sel.add(p.cid) : sel.delete(p.cid)); renderMain(); }
});
render();
</script>
