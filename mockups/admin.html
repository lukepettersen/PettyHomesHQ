<style>

}
@media (prefers-color-scheme: dark) {

    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
    --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
  --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;

* { box-sizing: border-box; }

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = id => document.getElementById(id);
const SECTIONS = [
  ["Team", [["users", "Users & roles"]]],
  ["Deals", [["pipelines", "Client statuses"], ["paforms", "Purchase agreement forms"], ["checklists", "Task templates"]]],
  ["People", [["reminders", "Date reminders"], ["fields", "Custom fields"], ["tags", "Tags"], ["lists", "Stages, sources & follow-up"]]],
  ["Messaging", [["texttpl", "Text templates"], ["emailtpl", "Email templates"]]],
  ["Connections", [["tools", "Tools menu"], ["integrations", "Integrations"]]],
];
let sec = "checklists", paSide = "buyer";
const PA_TYPES = [["text", "Text"], ["money", "Money"], ["number", "Number"], ["pct", "Percent"], ["date", "Date"], ["date-na", "Date or N/A"], ["datetime", "Date and time"], ["yesno", "Yes / No"], ["choice", "Dropdown"]];

const state = {
  users: [["Luke Pettersen", "luke@pettyhomes.com", "Admin", "Active"], ["Alyssa Chakiton", "assistant@pettyhomes.com", "Assistant", "Active"]],
  roles: ["Admin", "Assistant"],
  perms: [["See commissions", true, false], ["Delete people and deals", true, false], ["Manage users and roles", true, false], ["Edit checklist templates", true, true], ["Edit text and email templates", true, true], ["Export data", true, false], ["Send texts", true, true]],
  get pipes() { return HQ.settings.statuses; },
  tplId: "t4", ckApply: true, ckPending: null,
  get reminders() { return HQ.settings.reminders; },
  fields: [["Mailing name", "Text", "People"], ["Referred by", "Person", "People"], ["Homeiversary", "Date", "People"], ["Preferred contact time", "Dropdown", "People"], ["Pre-approval amount", "Number", "Deals"], ["Lender", "Person", "Deals"], ["New construction", "Checkbox", "Deals"]],
  get tags() { return HQ.settings.tags; },
  get stages() { return HQ.settings.stages; },
  get sources() { return HQ.settings.sources; },
  get follow() { return HQ.settings.follow; },
  templates: [
    ["Text", "BPC", "Intro + Homespotter + legal name", "Hi {first}! Great meeting you. Download Homespotter here: {link}. Can you confirm your full legal names for the buyer rep?"],
    ["Email", "BPC", "Initial phone call scheduled", "Hi {first},\n\nThanks for setting up a call with Luke! Here's what to expect and a quick guide to buying with Petty Homes (attached).", "Your call with Luke"],
    ["Email", "BPC", "Buyer rep breakdown", "Hi {first},\n\nAttached is the buyer representation agreement. Here's a quick breakdown of what it covers…"],
    ["Email", "BUC", "Purchase agreement accepted", "Hi {first},\n\nCongratulations! Your offer on {address} was accepted. Here are your key dates:\n\nInspection: {inspection_date}\nClosing: {closing_date}"],
    ["Text", "BUC", "Day-of-inspection", "Hi {first}, the inspection at {address} is today. I'll meet you there!"],
    ["Text", "BUC", "Earnest money", "Hi {first}, earnest money of {earnest_money} is due by {em_due}. Wiring instructions are in your email."],
    ["Email", "SPC", "CMA + net sheet", "Hi {first},\n\nAttached is the market analysis and estimated net sheet for {address}."],
    ["Text", "SUC", "We're pending", "Great news {first}, we're officially pending on {address}! 🎉"],
    ["Email", "Leads", "Website sign-up welcome", "Hi {first},\n\nThanks for signing up on pettyhomes.com…"],
  ],
  tplSel: 2, tplFilter: "All",
};
const ANCHORS = ["Start date", "Phone call", "Final Acceptance", "Inspection", "Written Statement", "HOA Rescission", "Closing"];
const TODAY_A = new Date(2026, 9, 12);
const TPLS = () => HQ.templates;
const curCk = () => TPLS().find(x => x.id === state.tplId) || TPLS()[0];
const stepCount = x => x.phases.reduce((n, ph) => n + ph.steps.length, 0);
const PA_TRIGGERS = [["Buyer · Under contract", "When a buyer-side purchase agreement is added"], ["Seller · Under contract", "When a seller-side purchase agreement is added"], ["Buyer · Closed", "When a buyer-side contract closes"], ["Seller · Closed", "When a seller-side contract closes"]];
const UC_DATES = [["insp", "Inspection deadline"], ["hoa", "HOA doc rescission"], ["ws", "Written Statement"], ["close", "Closing"]];
const trigOptions = () => Object.entries(state.pipes).flatMap(([p, st]) => st.map(x => `${p} · ${x}`)).concat(PA_TRIGGERS.map(x => x[0])).concat(["Phone call booked"]);
const blankStep = () => ({ name: "New step", anchor: "Start date", days: 1, dir: "after", who: "Alyssa", type: "Task", tpl: "", cond: "Always", advance: "" });
const applied = () => { const x = curCk(); if (state.ckApply && x.trigger) toast(`Open deals in ${x.trigger} get this change too.`); };
let tplN = 100;
const CONDS = ["Always", "HOA property", "Built before 1978", "New construction", "FHA / VA loan", "Condo / townhome"];

function msgTpl(type) {
  const folders = ["BPC", "BUC", "SPC", "SUC", "Leads", "Past clients"];
  const list = state.templates.map((t, i) => [t, i]).filter(([t]) => t[0] === type && (state.tplFilter === "All" || t[1] === state.tplFilter));
  if (!state.templates[state.tplSel] || state.templates[state.tplSel][0] !== type) state.tplSel = (list[0] || [null, -1])[1];
  const t = state.templates[state.tplSel];
  const used = t ? HQ.templates.filter(x => x.phases.some(ph => ph.steps.some(st => st.tpl === t[2]))).map(x => x.name) : [];
  return `<h1>${type} templates</h1><p>${type === "Text" ? "Used in Messages and by text steps in task templates." : "Used by email steps in task templates. Drafts open ready to review, then send from Gmail."} Merge fields fill in from the person and deal.</p>
    <div class="toolbar"><select id="tpl-filter" aria-label="Folder">${["All", ...folders].map(f => `<option value="${f}" ${f === state.tplFilter ? "selected" : ""}>${f === "All" ? "All folders" : f}</option>`).join("")}</select><button class="btn primary" data-newtpl="${type}">+ New ${type.toLowerCase()} template</button></div>
    <div class="box tpl"><div class="tpl-list">${list.map(([x, i]) => `<button class="tpl-i" data-tsel="${i}" aria-current="${i === state.tplSel}">${esc(x[2])}<small>${x[1]}</small></button>`).join("") || `<p class="muted sm" style="padding:10px 12px">None in this folder.</p>`}</div>
      ${t ? `<div class="tpl-ed"><div style="display:flex;gap:8px;flex-wrap:wrap"><label style="flex:1;min-width:180px">Name<input class="input" data-tf="2" value="${esc(t[2])}"></label><label>Folder<select class="input" data-tf="1">${folders.map(x => `<option ${x === t[1] ? "selected" : ""}>${x}</option>`).join("")}</select></label></div>
        ${type === "Email" ? `<label>Subject<input class="input" data-tf="4" value="${esc(t[4] || "")}" placeholder="e.g. Your key dates for {address}"></label>` : ""}

/* ---------- Save bar: Admin changes stay a draft until you save ---------- */
const dataKeys = () => Object.keys(state).filter(k => !Object.getOwnPropertyDescriptor(state, k).get && Array.isArray(state[k]));
const snapNow = () => JSON.stringify({ settings: HQ.settings, templates: HQ.templates, state: Object.fromEntries(dataKeys().map(k => [k, state[k]])) });
let saved = snapNow(), typing = false;
function restoreInto(target, src) {
  Object.keys(target).forEach(k => { if (!(k in src)) delete target[k]; });
  Object.entries(src).forEach(([k, v]) => {
    if (Array.isArray(v) && Array.isArray(target[k])) target[k].splice(0, target[k].length, ...v);
    else if (v && typeof v === "object" && target[k] && typeof target[k] === "object" && !Array.isArray(v)) restoreInto(target[k], v);
    else target[k] = v;
  });
}
function saveBar() {
  const dirty = typing || snapNow() !== saved, bar = el("savebar");
  bar.hidden = !dirty;
}
document.addEventListener("input", e => { if (e.target.closest("#main")) { typing = true; saveBar(); } });
document.addEventListener("change", () => setTimeout(saveBar));
document.addEventListener("click", e => {
  if (e.target.closest("[data-savechanges]")) { const a = window.document.activeElement; if (a && a.blur) a.blur(); typing = false; saved = snapNow(); saveBar(); toast("Changes saved."); return; }
  if (e.target.closest("[data-discard]")) { const o = JSON.parse(saved); restoreInto(HQ.settings, o.settings); HQ.templates.splice(0, HQ.templates.length, ...o.templates); dataKeys().forEach(k => state[k].splice(0, state[k].length, ...o.state[k])); typing = false; render(); saveBar(); toast("Changes discarded."); return; }
  setTimeout(saveBar);
});
