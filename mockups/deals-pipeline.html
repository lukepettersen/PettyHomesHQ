<title>Deals Pipeline Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top nav; view 1 = pipeline board (stage columns side by side, horizontal scroll); view 2 = simple deal page (up next + collapsible checklist, details on the side). */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --sunken: #eaeef0;
  --line: #d8dee2;
  --fg: #16222a;
  --muted: #5b6b75;
  --accent: #1d6a85;
  --accent-soft: #dcecf2;
  --ok: #2f7a4b;
  --ok-soft: #e0f0e5;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3372b;
  --bad-soft: #f9e1de;
  --waive: #6b6480;
  --waive-soft: #ebe8f2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
    --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
    --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
  --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
  --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.mock-bar { background: var(--accent-soft); padding-block: 7px; padding-inline: 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.topnav { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding-block: 12px; white-space: nowrap; }
.brand span { color: var(--accent); }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a { color: var(--muted); text-decoration: none; padding: 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav nav a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

.wrap { max-width: 1600px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.15; margin: 0; text-wrap: balance; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-ghost[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* Board */
.board-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.board-head .left { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.board-sum { color: var(--muted); font-size: 13px; }
.board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.col { flex: 1 0 172px; min-width: 172px; background: var(--sunken); border-radius: var(--r); display: flex; flex-direction: column; }
.col-h { padding: 8px 9px 6px; display: flex; flex-direction: column; gap: 1px; }
.col-h .name { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.col-h .name span:last-child { color: var(--muted); font-weight: 600; }
.col-h .vol { font-size: 11.5px; color: var(--muted); }
.col-h input { width: 100%; font-weight: 700; font-size: 13px; padding: 3px 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface); }
.col-tools { display: flex; gap: 4px; margin-top: 4px; }
.col-tools button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font-size: 12px; padding: 1px 7px; color: var(--muted); }
.col-tools button:hover { color: var(--fg); border-color: var(--muted); }
.col.add { flex: 0 0 150px; min-width: 150px; background: none; border: 2px dashed var(--line); color: var(--accent); font-weight: 600; padding: 14px; align-self: stretch; justify-content: center; align-items: center; }
.col.add:hover { border-color: var(--accent); }
.edit-note { font-size: 12.5px; color: var(--muted); background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; }
.cards { display: flex; flex-direction: column; gap: 5px; padding: 0 6px 8px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; width: 100%; font-size: 13px; }
.card:hover { border-color: var(--accent); }
.card .who { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.card .addr { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.card .addr span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .price { font-size: 12px; color: var(--fg); white-space: nowrap; }
.card .next { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 3px; margin-top: 2px; display: flex; justify-content: space-between; gap: 6px; }
.card .next.overdue { color: var(--bad); }
.card .next .date { white-space: nowrap; }
.card .next span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.g { background: var(--ok); } .dot.y { background: var(--warn); } .dot.r { background: var(--bad); }
.mini { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--ok); }
.col-foot { font-size: 12px; color: var(--accent); padding: 0 12px 10px; }

/* Contact page: three columns like FUB. Left = who they are, center = deal or timeline, right = tasks + deals. */
.muted { color: var(--muted); }
.edit-btn { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; align-self: flex-start; }
.ed label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.ed input, .ed select, .ed-row2 input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; color: var(--fg); font-weight: 400; }
.ed-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 22px; gap: 5px; align-items: center; }
.ed-row2 { display: flex; gap: 6px; }
.ed-row2 input { flex: 1; min-width: 0; }
.rm { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0; }
.addlink { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; text-align: left; align-self: flex-start; }
.ed-foot { display: flex; justify-content: flex-end; gap: 6px; }
.tagchip { display: inline-flex; align-items: center; }
.tagchip button { border: 0; background: none; color: inherit; padding: 0 0 0 5px; font-size: 13px; line-height: 1; }
.tagchip button:hover { color: var(--bad); }
.member { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
.member:first-of-type { border-top: 0; padding-top: 0; }
.member-n { font-weight: 700; font-size: 13px; }
.apply { display: flex; gap: 6px; flex-wrap: wrap; }
.apply select { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.row .due.waiting { color: var(--waive); font-style: italic; }
.dt.unset .v { color: var(--muted); }
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 30; padding: 16px; overflow-y: auto; }
.deal-modal { background: var(--surface); border-radius: 10px; padding: 18px; width: min(720px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow-y: auto; }
.deal-modal h2 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.deal-modal label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.deal-modal input, .deal-modal select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13.5px; color: var(--fg); font-weight: 400; width: 100%; }
.dm-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deal-modal fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; margin: 0; }
.deal-modal legend { font-weight: 700; font-size: 13px; padding: 0 4px; }
.dm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.dm-prev { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.deal-modal .foot { display: flex; justify-content: flex-end; gap: 6px; }
@media (max-width: 560px) { .dm-top { grid-template-columns: 1fr; } }
.ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.ptabs button { border: 0; border-bottom: 3px solid transparent; background: none; padding: 8px 14px; font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
.ptabs button span { font-size: 12.5px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.ptabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--coral, var(--accent)); }
.pcols { display: grid; grid-template-columns: repeat(var(--n), minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.pcol { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pcol-h { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-top: 4px solid var(--bar, var(--line)); background: var(--surface); border-radius: 6px; box-shadow: 0 0 0 1px var(--line); font-size: 13.5px; }
.pi-av { display: flex; gap: 4px; margin-top: 4px; }
.pcol-b { display: flex; flex-direction: column; gap: 6px; }
.pcol-e { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }
.pitem { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 13px; cursor: pointer; }
.pitem:hover { border-color: var(--accent); }
.pi-t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pi-t b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-n { font-size: 12px; color: var(--fg); border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.pi-n.od { color: var(--bad); font-weight: 600; }
.pclosed { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
@media (max-width: 760px) { .pcols { grid-template-columns: minmax(0, 1fr); } }
.psec { display: flex; flex-direction: column; gap: 8px; }
.psec h2 { margin: 6px 0 0; font-family: var(--font-display); font-size: 17px; }
.plist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow-c { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 12px 14px; display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(0, 2.2fr) minmax(170px, 1.1fr); gap: 16px; align-items: center; }
.prow-c:first-child { border-top: 0; }
.prow-c:hover { background: var(--bg); }
.pr-who { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.pr-who .dot { margin-top: 7px; }
.pr-who > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.pr-next { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13px; }
.pr-next .od { color: var(--bad); font-weight: 600; font-size: 12.5px; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 3px; min-width: 0; }
.stepper li { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 4px; background: var(--sunken); position: relative; }
.stepper li:first-child { border-radius: 999px 0 0 999px; }
.stepper li:last-child { border-radius: 0 999px 999px 0; }
.stepper li span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper li.past { background: var(--accent-soft); color: var(--accent); }
.stepper li.now { background: var(--accent); color: var(--surface); }
@media (max-width: 900px) { .prow-c { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 980px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.col3 { background: var(--sunken); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.col3-h { padding: 10px 12px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.seg.tiny button { padding: 2px 9px; font-size: 12px; }
.meta2 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; }
.pill2 { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.closed-row { display: flex; flex-direction: column; gap: 8px; }
.closed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; padding: 0; }
.pa-box { margin: 6px 12px 10px; border: 1px solid var(--accent); border-radius: var(--r); overflow: hidden; }
.pa-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 12px; background: var(--accent-soft); }
.pa-h .btn { padding: 3px 10px; font-size: 12.5px; }
.pa-cta { margin: 6px 12px 10px; padding: 12px; border: 1px dashed var(--accent); border-radius: var(--r); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.past-pa { display: flex; justify-content: space-between; gap: 8px; padding: 6px 14px; font-size: 13px; border-top: 1px solid var(--line); }
.stsel { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stsel select { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.chk { flex-direction: row !important; align-items: center; gap: 8px !important; font-size: 13px !important; color: var(--fg) !important; }
.chk input { width: auto !important; }
.sm-btn { padding: 3px 10px; font-size: 12.5px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: inherit; }
.sm { font-size: 12.5px; }
.od { color: var(--bad); font-size: 12.5px; } .td { color: var(--accent); font-size: 12.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.c3 { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 1100px) { .c3 { grid-template-columns: 270px minmax(0, 1fr); } .cright { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; } }
@media (max-width: 760px) { .c3 { grid-template-columns: minmax(0, 1fr); } .cright { grid-column: auto; } }
.cleft, .cright { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ccenter { min-width: 0; display: flex; flex-direction: column; gap: 0; }
.card-s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card-s h3 { margin: 0; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.card-s p { margin: 0; }
.who-h { display: flex; gap: 12px; align-items: center; }
.who-h h1 { font-size: 19px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.contact-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.contact-l li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; overflow-wrap: anywhere; }
.ic { color: var(--muted); text-align: center; }
.lk { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.kv dd { margin: 0; }
.due-chip { font-size: 11px; font-weight: 700; background: var(--warn-soft); color: var(--warn); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tagchip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.tag-add, .plus { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--accent); color: var(--surface); font-weight: 700; line-height: 1; padding: 0; }
.plus { margin-left: auto; }

.ctabs { display: flex; gap: 2px; overflow-x: auto; }
.ctabs button { border: 1px solid var(--line); border-bottom: 0; background: var(--sunken); padding: 8px 14px; border-radius: var(--r) var(--r) 0 0; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ctabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 0 var(--r) var(--r) var(--r); padding-bottom: 6px; }
.pane-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center; padding: 12px 14px 10px; }
.dp-r { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sidechip { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.sidechip.buyer { background: var(--accent-soft); color: var(--accent); }
.sidechip.seller { background: var(--ok-soft); color: var(--ok); }
.pad { padding: 0 14px 8px; display: flex; flex-direction: column; gap: 8px; }
.factline { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 14px 8px; font-size: 12.5px; }
.factline em { font-style: normal; color: var(--muted); margin-right: 3px; }
.factline .hid { color: var(--muted); }
.subh { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 14px 2px; }
.fullcl { border-top: 1px solid var(--line); margin-top: 4px; }

.composer { margin: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.comp-tabs { display: flex; gap: 4px; }
.comp-tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.comp-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.composer textarea, .composer select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px; resize: vertical; }
.composer select { width: auto; padding: 5px 8px; }
.comp-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.tl-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 14px 8px; }
.tl-filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.tl-filters button span { color: var(--muted); }

    const txt = st === "met" ? "✓ Met" : st === "waived" ? "Waived" : st === "extended" ? "Extended" : n === 0 ? "Today" : n > 0 ? `In ${n} day${n === 1 ? "" : "s"}` : "Past due";
    const cls = st !== "pending" ? st : n <= 3 ? "soon" : "";
    return `<button class="dt" data-dl="${dl.id}" data-ms="${k}" aria-expanded="${editing === dl.id + ":" + k}"><span class="l">${MS_NAMES[k]}</span><span class="v date">${fmt(d(dl.ms[k]))}</span><span class="s ${cls}">${txt}</span></button>`;
  }).join("")}</div>`;
  const k = editing && editing.startsWith(dl.id + ":") ? editing.split(":")[1] : null;
  if (k) {
    const n = dl.tasks.filter(t => t.a === k && t.s === "open").length;
    html += `<div class="edit">
      <label>${MS_NAMES[k]} date<input type="date" data-msdate="${dl.id}:${k}" value="${dl.ms[k] || ""}"></label>
      <label>Status<select data-msstatus="${dl.id}:${k}">${["pending", "met", "waived", "extended"].map(s => `<option value="${s}" ${s === dl.msStatus[k] ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select></label>
      <p>${n} open step${n === 1 ? "" : "s"} move with this date. Waived clears them.</p>
      <button class="btn" data-close="1">Done</button>
    </div>`;
  }
  return html;
}

function phaseHtml(dl, p) {
  const items = dl.tasks.filter(t => t.phase === p).sort(byDue(dl));
  const done = items.filter(t => eff(dl, t) !== "open").length;
  const isOpen = expanded[dl.id].has(p);
  const od = items.some(t => eff(dl, t) === "open" && isOverdue(dl, t));
  return `<div class="phase">
    <button class="phase-h" data-dl="${dl.id}" data-phase="${esc(p)}" aria-expanded="${isOpen}">
      <span class="pn">${esc(p)}</span>
      <span class="pc">${od ? `<span class="dot y"></span>` : ""}${done === items.length ? `<span class="ok">✓ Done</span>` : `${done}/${items.length}`}</span>
    </button>
    ${isOpen ? `<div class="phase-body">${items.map(t => rowHtml(dl, t)).join("")}</div>` : ""}
  </div>`;
}

function rowHtml(dl, t) {
  const st = eff(dl, t), due = dueOf(dl, t), n = due ? diff(due, TODAY) : null;
  const icon = st === "done" ? CHECK : st === "open" ? "" : DASH;
  const note = st === "na" ? "N/A" : st === "skip" ? "Skipped" : st === "waived" ? "Waived" : "";
  const dueCls = !due ? "waiting" : st === "open" ? (n < 0 ? "overdue" : n === 0 ? "today" : "") : "";
  const rule = t.a ? `${MS_NAMES[t.a]} ${t.o === 0 ? "day of" : (t.o > 0 ? "+ " : "− ") + Math.abs(t.o) + "d"}` : "";
  const key = dl.id + ":" + t.id, A = `data-dl="${dl.id}"`;
  return `<div class="row ${st}">
    <button class="check" ${A} data-toggle="${t.id}" aria-label="Mark ${st === "done" ? "not done" : "done"}: ${esc(t.t)}">${icon}</button>
    <span class="title">${esc(t.t)}${note ? `<small>${note}</small>` : ""}${t.kind !== "task" && st === "open" ? `<button class="draft" ${A} data-draft="${t.id}">Draft ${t.kind}</button>` : ""}</span>
    <span class="r"><span class="due date ${dueCls}" title="${rule}">${!due ? "Waits for " + MS_NAMES[t.a] : n === 0 && st === "open" ? "Today" : short(due)}</span><span class="av ${t.who === "AS" ? "as" : ""}">${t.who}</span><button class="more" ${A} data-menu="${t.id}" aria-label="More options">⋯</button></span>
    ${openMenu === key ? `<div class="menu">
      ${st !== "na" ? `<button ${A} data-set="na" data-id="${t.id}">Mark N/A</button>` : ""}
      ${st !== "skip" ? `<button ${A} data-set="skip" data-id="${t.id}">Skip</button>` : ""}
      ${st !== "open" && st !== "waived" ? `<button ${A} data-set="open" data-id="${t.id}">Reopen</button>` : ""}
      ${rule ? `<span style="font-size:12px;color:var(--muted);align-self:center">Timing: ${rule}</span>` : ""}
    </div>` : ""}
  </div>`;
}

function memberNames(name) {

  if (!a.includes(" ")) a += " " + b.split(" ").slice(1).join(" ");

}
function contactLines(c) {

function collect() {

  const facts = { ptype: v.ptype, year: v.year, hoa: v.hoa, newc: v.newc };
  if (dl.kind === "pa") {
    Object.assign(dl, { line: v.address, price: +v.price, em: +v.em || 0, sc: +v.sc || 0, fin: v.fin, comm: +v.comm || 0, bac: v.bac, facts, people: F.people[dl.side].filter(([k]) => v[k]).map(([k, l]) => [v[k], l]) });
    const keys = ["fa", "insp", "ws"].concat(v.hoa === "Yes" ? ["hoa"] : []).concat(["close"]);
    let moved = 0;
    keys.forEach(k => {
      const nv = v[k === "hoa" ? "hoa_d" : k] || null, old = dl.ms[k];
      if (!(k in dl.ms)) { dl.ms[k] = nv; dl.msStatus[k] = "pending"; return; }
      if (nv !== old) { moved += dl.tasks.filter(t => t.a === k && t.s === "open").length; if (old && nv && dl.msStatus[k] === "pending") { dl.msOrig = dl.msOrig || {}; dl.msOrig[k] = old; dl.msStatus[k] = "extended"; } dl.ms[k] = nv; }
    });
    if (v.hoa !== "Yes" && "hoa" in dl.ms) delete dl.ms.hoa;
    dealForm = null; renderDealModal(); render(); toast(`Saved.${moved ? ` ${moved} step${moved === 1 ? "" : "s"} re-dated.` : ""}`); return;
  }
  if (dl.kind === "buyer") Object.assign(dl.info, { areas: v.areas, range: v.range, timeframe: v.timeframe, preapproved: v.preapproved, lender: v.lender, repSigned: v.repSigned, repExpires: v.repExpires, bac: v.bac, offer: v.offer, respond: v.respond });
  else { dl.line = v.address; dl.price = +v.price || 0; dl.facts = facts; Object.assign(dl.info, { lcSigned: v.lcSigned, lcExpires: v.lcExpires, comm: v.comm, bac: v.bac, photos: v.photos, active: v.active }); }
  const st = f.status; dealForm = null; renderDealModal();
  if (st !== dl.status && !activePA(dl)) setStatus(dl, st); else { render(); toast("Saved."); }
}
function renderDealModal() {
  el("deal-modal").innerHTML = dealForm ? dealModalHtml() : "";
  if (dealForm) el("deal-form").addEventListener("submit", e => { e.preventDefault(); submitForm(); });
}
function readDealForm() { document.querySelectorAll("[data-df]").forEach(i => { dealForm.v[i.dataset.df] = i.type === "checkbox" ? (i.checked ? "on" : "") : i.value; }); }
function submitForm() {
  readDealForm();
  const f = dealForm, v = f.v;
  if (f.editId) { const miss = formGroups().flatMap(([, fs]) => fs).filter(x => x[4] && !v[x[0]]); if (miss.length) { toast(`Add ${miss.map(x => x[1].toLowerCase()).join(" and ")} first.`); return; } saveEdit(); return; }
  const missing = formGroups().flatMap(([, fs]) => fs).filter(x => x[4] && !v[x[0]]);
  if (missing.length) { toast(`Add ${missing.map(x => x[1].toLowerCase()).join(" and ")} first.`); return; }
  const id = Math.max(...deals.map(x => x.id)) + 1;
  const facts = { ptype: v.ptype, year: v.year, hoa: v.hoa, newc: v.newc };
  if (f.mode === "pa") {
    const eng = deals.find(x => x.id === f.engId), side = sideOf(eng);
    const pa = { id, kind: "pa", parent: eng.id, side, cid: eng.cid, name: eng.name, status: "Active", line: v.address, price: +v.price, em: +v.em || 0, sc: +v.sc || 0, bac: v.bac, comm: +v.comm || 0, fin: v.fin, facts,
      ms: { fa: v.fa || null, insp: v.insp || null, ws: v.ws || null }, msStatus: {}, tasks: [],
      people: F.people[side].filter(([k]) => v[k]).map(([k, l]) => [v[k], l]) };
    if (v.hoa === "Yes") pa.ms.hoa = v.hoa_d || null;
    pa.ms.close = v.close || null;
    Object.keys(pa.ms).forEach(k => pa.msStatus[k] = pa.ms[k] && d(pa.ms[k]) < TODAY ? "met" : "pending");
    const n = addSteps(pa, triggerOf(pa), pa.ms.fa ? d(pa.ms.fa) : TODAY);
    deals.push(pa);
    dealForm = null; renderDealModal(); openCard(eng.id);
    toast(`Purchase agreement added. ${n} ${side}-side Under contract tasks started.`); return;
  }
  const c = contact(f.cid);
  const eng = { id, kind: f.mode, cid: f.cid, name: c.name, status: f.status, since: iso(TODAY), tasks: [], ms: {}, msStatus: {} };
  if (f.mode === "buyer") eng.info = { areas: v.areas, range: v.range, timeframe: v.timeframe, preapproved: v.preapproved, lender: v.lender, repSigned: v.repSigned, repExpires: v.repExpires, bac: v.bac, offer: v.offer, respond: v.respond };
  else { eng.line = v.address; eng.price = +v.price || 0; eng.facts = facts; eng.info = { lcSigned: v.lcSigned, lcExpires: v.lcExpires, comm: v.comm, bac: v.bac, photos: v.photos, active: v.active }; }
  const n = addSteps(eng, triggerOf(eng), TODAY);
  deals.push(eng);
  const tag = f.mode === "buyer" ? "Buyer" : "Seller"; if (!c.tags.includes(tag)) c.tags.push(tag);
  const thenPa = v.accepted === "on";
  dealForm = null; renderDealModal(); openCard(id);
  toast(`${f.mode === "buyer" ? "Buyer" : "Listing"} started with ${n} tasks.`);
  if (thenPa) openForm("pa", { engId: id, v: f.mode === "listing" ? { address: eng.line, price: eng.price || "", ptype: v.ptype, year: v.year, hoa: v.hoa, newc: v.newc } : {} });
}
// Moving a buyer or listing to a new status adds that status's checklist (earlier tasks stay).
function setStatus(eng, status) {
  if (eng.status === status) return;
  eng.status = status; eng.started = eng.started || {};
  let n = 0;
  if (!eng.started[status]) { eng.started[status] = true; n = addSteps(eng, triggerOf(eng), TODAY); }
  if (eng.kind === "listing" && status === "Active" && !eng.info.active) eng.info.active = iso(TODAY);
  render(); toast(`Moved to ${status}.${n ? ` Added ${n} tasks.` : ""}`);
}

/* ---------- Events ---------- */
function render() { openContact ? renderContact() : renderActive(); }
let tt;
function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

function openCard(dealId) {
  const dl = deals.find(x => x.id === dealId);
  const eng = dl.kind === "pa" ? deals.find(x => x.id === dl.parent) : dl;
  openContact = cidOf(dl); editing = null; editCard = null; draft = null; tagAdding = false; openMenu = null; tlFilter = "all";
  ctab[openContact] = isActive(eng) ? "deal-" + eng.id : "timeline";
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const bg = e.target.closest("[data-dclose]");
  if (bg && (e.target === bg || bg.tagName === "BUTTON")) { dealForm = null; renderDealModal(); return; }
  const b = e.target.closest("button"); if (!b) return;
  const dl = b.dataset.dl ? deals.find(x => x.id === +b.dataset.dl) : null;
  if (b.dataset.pview) { pview = b.dataset.pview; render(); return; }
  if (b.dataset.showclosed) { showClosed = !showClosed; render(); return; }
  if (b.dataset.start) { openForm(b.dataset.start, { cid: openContact }); return; }
  if (b.dataset.addpa) { const eng = deals.find(x => x.id === +b.dataset.addpa); openForm("pa", { engId: eng.id, v: eng.kind === "listing" ? Object.assign({ address: eng.line, price: eng.price || "" }, eng.facts || {}) : {} }); return; }
  if (b.dataset.editeng) { editForm(deals.find(x => x.id === +b.dataset.editeng)); return; }
  if (b.dataset.editpa) { editForm(deals.find(x => x.id === +b.dataset.editpa)); return; }
  if (b.dataset.engopen) { engOpen[b.dataset.engopen] = !engOpen[b.dataset.engopen]; render(); return; }
  if (b.dataset.paterm) {
    const pa = deals.find(x => x.id === +b.dataset.paterm), eng = deals.find(x => x.id === pa.parent);
    if (pa._confirm !== "term") { pa._confirm = "term"; toast("Click Fell through again to confirm."); return; }
    pa.status = "Terminated"; pa.ended = iso(TODAY); pa.tasks.forEach(t => { if (t.s === "open") t.s = "na"; });
    eng.status = eng.kind === "buyer" ? "Showing homes" : "Active"; render(); toast(`Contract marked as fell through. ${eng.kind === "buyer" ? "Buyer is back to Showing homes" : "Listing is back to Active"}; the contract stays in history.`); return;
  }
  if (b.dataset.paclose) {
    const pa = deals.find(x => x.id === +b.dataset.paclose), eng = deals.find(x => x.id === pa.parent), c = contact(pa.cid);
    pa.status = "Closed"; pa.closed = iso(TODAY); eng.status = "Closed"; c.stage = "Past Client";
    if (pa.side === "buyer") c.homeiversary = fmt(TODAY).replace(/^\w+ /, "") + ", 2026";
    const post = stepsFor(`${pa.side === "buyer" ? "Buyer" : "Seller"} · Closed`, pa.facts, TODAY).tasks.map(t => ({ t: t.t, due: t.fixed, who: t.who, s: "open" }));
    c.tasks.push(...post); if (typeof HQ !== "undefined") HQ.newTasks.push(...post.filter(t => t.due).map(t => Object.assign({ cid: pa.cid, name: c.name }, t)));
    ctab[openContact] = "timeline"; render(); toast(`Closed! ${c.name} is now a Past Client.${post.length ? ` ${post.length} post-close tasks added.` : ""}`); return;
  }
  if (b.dataset.deal) { openCard(+b.dataset.deal); return; }
  if (b.dataset.applyopen) { applyOpen = true; render(); return; }
  if (b.dataset.applycancel) { applyOpen = false; render(); return; }
  if (b.dataset.applytpl) {
    const tpl = HQ.templates.find(x => x.id === el("apply-tpl").value), c = contact(openContact);
    const made = HQ.expand(tpl, TODAY).map(x => ({ t: x.t, due: x.due ? iso(x.due) : null, waiting: x.waiting, who: x.who === "Alyssa" ? "AS" : "LP", s: "open" }));
    c.tasks.push(...made);
    HQ.newTasks.push(...made.filter(x => x.due || !x.waiting).map(x => Object.assign({ cid: openContact, name: c.name }, x)));
    const w = made.filter(x => x.waiting).length;
    applyOpen = false; render(); toast(`Added ${made.length} tasks from "${tpl.name}".${w ? ` ${w} wait for a contract date.` : ""} Dated ones are on the Tasks page too.`); return;
  }
  if (b.dataset.editcard) { const c = contact(openContact); editCard = b.dataset.editcard; draft = JSON.parse(JSON.stringify(c)); draft.assigned = draft.assigned || "Luke Pettersen"; draft.newMode = {}; render(); return; }
  if (b.dataset.cancelcard) { editCard = null; draft = null; render(); return; }
  if (b.dataset.savecard) { saveCard(b.dataset.savecard); return; }
  if (b.dataset.addrow) { collect(); const f = { p: "phones", e: "emails", h: "birthdays" }[b.dataset.addrow]; draft[f].push([b.dataset.addrow === "p" ? "Mobile" : "", ""]); render(); return; }
  if (b.dataset.rm) { collect(); const [k, i] = b.dataset.rm.split(":"); draft[{ p: "phones", e: "emails", h: "birthdays" }[k]].splice(+i, 1); render(); return; }
  if (b.dataset.rmtag) { const c = contact(openContact); const t = c.tags.splice(+b.dataset.rmtag, 1)[0]; toast(`Removed tag "${t}".`); render(); return; }
  if (b.dataset.tagadd) { tagAdding = true; render(); const i = el("tag-in"); if (i) i.focus(); return; }
  if (b.dataset.tagcancel) { tagAdding = false; render(); return; }
  if (b.dataset.tagsave) { addTag(); return; }
  if (b.dataset.opencontact) { openContact = b.dataset.opencontact; tlFilter = "all"; editing = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.back) { openContact = null; editing = null; try { history.replaceState(null, "", location.pathname); } catch (_) {} render(); return; }
  if (b.dataset.ctab) { ctab[openContact] = b.dataset.ctab; editing = null; render(); return; }
  if (b.dataset.comp) { composer = b.dataset.comp; render(); const t = el("comp-text"); if (t) t.focus(); return; }
  if (b.dataset.tlf) { tlFilter = b.dataset.tlf; render(); return; }
  if (b.dataset.save) {
    const ta = el("comp-text"), txt = ta && ta.value.trim();
    if (!txt) { toast("Type something first."); return; }
    const c = contact(openContact);
    const kind = composer === "call" ? "call" : composer === "logtext" ? "text" : composer;
    const out = composer === "call" ? el("call-outcome").value + ": " : composer === "logtext" ? "Logged: " : "";
    c.history.unshift([iso(TODAY), kind, out + txt, "LP"]);
    toast(composer === "note" ? "Note saved." : composer === "text" ? "Text sent." : composer === "logtext" ? "Text logged." : "Call logged.");
    render(); return;
  }
  if (b.dataset.ptask) { const t = contact(openContact).tasks[+b.dataset.ptask]; t.s = t.s === "open" ? "done" : "open"; render(); return; }
  if (b.dataset.ms) { const k = dl.id + ":" + b.dataset.ms; editing = editing === k ? null : k; render(); return; }
  if (b.dataset.close) { editing = null; render(); return; }
  if (b.dataset.phase) { const s = expanded[dl.id]; s.has(b.dataset.phase) ? s.delete(b.dataset.phase) : s.add(b.dataset.phase); render(); return; }
  if (b.dataset.toggle) {
    const t = dl.tasks[+b.dataset.toggle];
    if (eff(dl, t) === "waived") { toast("Cleared by a waived deadline."); return; }
    t.s = t.s === "open" ? "done" : "open";
    if (t.s === "done" && t.advance && dl.kind !== "pa" && STATUS[dl.kind].includes(t.advance) && STATUS[dl.kind].indexOf(t.advance) > STATUS[dl.kind].indexOf(dl.status)) { setStatus(dl, t.advance); return; }
    if (t.s === "done") toast("Done. Logged to the timeline and cleared from Tasks.");
    render(); return;
  }
  if (b.dataset.menu) { const k = dl.id + ":" + b.dataset.menu; openMenu = openMenu === k ? null : k; render(); return; }
  if (b.dataset.set) { dl.tasks[+b.dataset.id].s = b.dataset.set; openMenu = null; render(); return; }
  if (b.dataset.draft) { const t = dl.tasks[+b.dataset.draft]; toast(`Opens a pre-filled ${t.kind}: "${t.t}". You review, then send.`); return; }
  if (b.dataset.toast) { toast(b.dataset.toast); return; }
  if (b.id === "role-admin" || b.id === "role-assistant") {
    role = b.id === "role-admin" ? "admin" : "assistant";
    el("role-admin").setAttribute("aria-pressed", role === "admin");
    el("role-assistant").setAttribute("aria-pressed", role === "assistant");
    render(); return;
  }
});

document.addEventListener("change", e => {
  const ds = e.target.dataset;
  if (dealForm && (ds.df !== undefined || ds.dstatus || ds.dcid)) {
    readDealForm();
    if (ds.dstatus) dealForm.status = e.target.value;
    if (ds.dcid) dealForm.cid = e.target.value;
    // Redraw only when the set of fields changes; otherwise just refresh the preview.
    if (ds.dstatus || ds.df === "hoa") renderDealModal(); else if (el("dm-prev")) el("dm-prev").innerHTML = previewHtml();
    return;
  }
  if (ds.estatus) { setStatus(deals.find(x => x.id === +ds.estatus), e.target.value); return; }
  if (ds.f && e.target.value === "__new") { collect(); draft.newMode[ds.f] = true; render(); const i = document.querySelector(`[data-new="${ds.f}"]`); if (i) i.focus(); return; }
  if (ds.msdate && e.target.value) {
    const [id, k] = ds.msdate.split(":"), dl = deals.find(x => x.id === +id);
    const n = dl.tasks.filter(t => t.a === k && t.s === "open").length, wasSet = !!dl.ms[k];
    dl.ms[k] = e.target.value;
    if (wasSet && dl.msStatus[k] === "pending") dl.msStatus[k] = "extended";
    toast(wasSet ? `${MS_NAMES[k]} moved to ${fmt(d(e.target.value))}. ${n} step${n === 1 ? "" : "s"} re-dated.` : `${MS_NAMES[k]} set. ${n} waiting step${n === 1 ? " has" : "s have"} due dates now.`);
    render(); return;
  }
  if (ds.msstatus) { const [id, k] = ds.msstatus.split(":"); deals.find(x => x.id === +id).msStatus[k] = e.target.value; render(); }
});

function addTag() {
  const i = el("tag-in"), v = i && i.value.trim(); if (!v) return;
  const c = contact(openContact);
  if (!c.tags.includes(v)) c.tags.push(v);
  const isNew = !ALL_TAGS.includes(v); if (isNew) ALL_TAGS.push(v);
  tagAdding = false; toast(isNew ? `Created new tag "${v}".` : `Tagged "${v}".`); render();
}
document.addEventListener("keydown", e => { if (e.target.id === "tag-in" && e.key === "Enter") { e.preventDefault(); addTag(); } if (e.target.id === "tag-in" && e.key === "Escape") { tagAdding = false; render(); } });

// Deep link from the Tasks mockup: deals.html#contact-calloway
function fromHash() {
  const m = location.hash.match(/^#contact-([\w-]+)$/);
  if (m && (CONTACTS[m[1]] || EXTRA[m[1]] || deals.some(x => cidOf(x) === m[1]))) {
    openContact = m[1]; tlFilter = "all";
    render(); window.scrollTo(0, 0);
  }
}
window.addEventListener("hashchange", fromHash);
render();
fromHash();
</script>
