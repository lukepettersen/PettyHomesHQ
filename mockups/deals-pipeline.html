<title>Deals Pipeline Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top nav; view 1 = pipeline board (stage columns side by side, horizontal scroll); view 2 = simple deal page (up next + collapsible checklist, details on the side). */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --sunken: #eaeef0;
  --line: #d8dee2;
  --fg: #16222a;
  --muted: #5b6b75;
  --accent: #1d6a85;
  --accent-soft: #dcecf2;
  --ok: #2f7a4b;
  --ok-soft: #e0f0e5;
  --warn: #9a6400;
  --warn-soft: #fbefd6;
  --bad: #b3372b;
  --bad-soft: #f9e1de;
  --waive: #6b6480;
  --waive-soft: #ebe8f2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
    --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
    --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45;
  --fg: #e4ecf0; --muted: #93a5b0; --accent: #5fb3d1; --accent-soft: #173a48;
  --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.mock-bar { background: var(--accent-soft); padding-block: 7px; padding-inline: 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.topnav { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding-block: 12px; white-space: nowrap; }
.brand span { color: var(--accent); }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a { color: var(--muted); text-decoration: none; padding: 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav nav a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }

.wrap { max-width: 1600px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.15; margin: 0; text-wrap: balance; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-ghost[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

/* Board */
.board-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.board-head .left { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.board-sum { color: var(--muted); font-size: 13px; }
.board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.col { flex: 1 0 172px; min-width: 172px; background: var(--sunken); border-radius: var(--r); display: flex; flex-direction: column; }
.col-h { padding: 8px 9px 6px; display: flex; flex-direction: column; gap: 1px; }
.col-h .name { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.col-h .name span:last-child { color: var(--muted); font-weight: 600; }
.col-h .vol { font-size: 11.5px; color: var(--muted); }
.col-h input { width: 100%; font-weight: 700; font-size: 13px; padding: 3px 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--surface); }
.col-tools { display: flex; gap: 4px; margin-top: 4px; }
.col-tools button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; font-size: 12px; padding: 1px 7px; color: var(--muted); }
.col-tools button:hover { color: var(--fg); border-color: var(--muted); }
.col.add { flex: 0 0 150px; min-width: 150px; background: none; border: 2px dashed var(--line); color: var(--accent); font-weight: 600; padding: 14px; align-self: stretch; justify-content: center; align-items: center; }
.col.add:hover { border-color: var(--accent); }
.edit-note { font-size: 12.5px; color: var(--muted); background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; }
.cards { display: flex; flex-direction: column; gap: 5px; padding: 0 6px 8px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; width: 100%; font-size: 13px; }
.card:hover { border-color: var(--accent); }
.card .who { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.card .addr { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.card .addr span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .price { font-size: 12px; color: var(--fg); white-space: nowrap; }
.card .next { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 3px; margin-top: 2px; display: flex; justify-content: space-between; gap: 6px; }
.card .next.overdue { color: var(--bad); }
.card .next span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.g { background: var(--ok); } .dot.y { background: var(--warn); } .dot.r { background: var(--bad); }
.mini { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--ok); }
.col-foot { font-size: 12px; color: var(--accent); padding: 0 12px 10px; }

/* Contact page: three columns like FUB. Left = who they are, center = deal or timeline, right = tasks + deals. */
.muted { color: var(--muted); }
.edit-btn { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; align-self: flex-start; }
.ed label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.ed input, .ed select, .ed-row2 input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; color: var(--fg); font-weight: 400; }
.ed-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 22px; gap: 5px; align-items: center; }
.ed-row2 { display: flex; gap: 6px; }
.ed-row2 input { flex: 1; min-width: 0; }
.rm { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 0; }
.addlink { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; text-align: left; align-self: flex-start; }
.ed-foot { display: flex; justify-content: flex-end; gap: 6px; }
.tagchip { display: inline-flex; align-items: center; }
.tagchip button { border: 0; background: none; color: inherit; padding: 0 0 0 5px; font-size: 13px; line-height: 1; }
.tagchip button:hover { color: var(--bad); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: inherit; }
.sm { font-size: 12.5px; }
.od { color: var(--bad); font-size: 12.5px; } .td { color: var(--accent); font-size: 12.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.c3 { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 1100px) { .c3 { grid-template-columns: 270px minmax(0, 1fr); } .cright { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; } }
@media (max-width: 760px) { .c3 { grid-template-columns: minmax(0, 1fr); } .cright { grid-column: auto; } }
.cleft, .cright { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ccenter { min-width: 0; display: flex; flex-direction: column; gap: 0; }
.card-s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card-s h3 { margin: 0; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.card-s p { margin: 0; }
.who-h { display: flex; gap: 12px; align-items: center; }
.who-h h1 { font-size: 19px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.contact-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.contact-l li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; overflow-wrap: anywhere; }
.ic { color: var(--muted); text-align: center; }
.lk { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.kv dd { margin: 0; }
.due-chip { font-size: 11px; font-weight: 700; background: var(--warn-soft); color: var(--warn); padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tagchip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.tag-add, .plus { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--accent); color: var(--surface); font-weight: 700; line-height: 1; padding: 0; }
.plus { margin-left: auto; }

.ctabs { display: flex; gap: 2px; overflow-x: auto; }
.ctabs button { border: 1px solid var(--line); border-bottom: 0; background: var(--sunken); padding: 8px 14px; border-radius: var(--r) var(--r) 0 0; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ctabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 0 var(--r) var(--r) var(--r); padding-bottom: 6px; }
.pane-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: center; padding: 12px 14px 10px; }
.dp-r { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.sidechip { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; }
.sidechip.buyer { background: var(--accent-soft); color: var(--accent); }
.sidechip.seller { background: var(--ok-soft); color: var(--ok); }
.pad { padding: 0 14px 8px; display: flex; flex-direction: column; gap: 8px; }
.factline { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 14px 8px; font-size: 12.5px; }
.factline em { font-style: normal; color: var(--muted); margin-right: 3px; }
.factline .hid { color: var(--muted); }
.subh { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 14px 2px; }
.fullcl { border-top: 1px solid var(--line); margin-top: 4px; }

.composer { margin: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.comp-tabs { display: flex; gap: 4px; }
.comp-tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.comp-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.composer textarea, .composer select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px; resize: vertical; }
.composer select { width: auto; padding: 5px 8px; }
.comp-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.tl-filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 14px 8px; }
.tl-filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.tl-filters button span { color: var(--muted); }
.tl-filters button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.tl-filters button[aria-pressed="true"] span { color: inherit; opacity: .7; }
.tl { list-style: none; margin: 0; padding: 0 14px 8px; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.tk { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
.tk.note { color: var(--accent); } .tk.text { color: var(--ok); } .tk.call { color: var(--waive); } .tk.missed { color: var(--bad); } .tk.email { color: var(--warn); } .tk.done { color: var(--ok); }

.ptask { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; padding-top: 6px; border-top: 1px solid var(--line); }
.ptask:first-of-type { border-top: 0; }
.ptask.done .title { color: var(--muted); text-decoration: line-through; }
.ptask .check { width: 18px; height: 18px; }
.ptask.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.deal-li { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 600; }
.deal-li:hover { border-color: var(--accent); }
.deal-li .muted { font-weight: 400; }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; }

/* Deal panel parts */
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; align-self: flex-start; }
.dhead { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-end; }
.dhead .sub { color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.stagepill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.health { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }

.dates { display: flex; flex-wrap: wrap; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dt { flex: 1 1 130px; text-align: left; border: 0; border-right: 1px solid var(--line); background: none; padding: 9px 12px; display: flex; flex-direction: column; gap: 1px; }
.dt:last-child { border-right: 0; }
.dt:hover, .dt[aria-expanded="true"] { background: var(--accent-soft); }
.dt .l { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.dt .v { font-size: 13px; }
.dt .s { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.dt .s.met { color: var(--ok); } .dt .s.waived { color: var(--waive); } .dt .s.extended { color: var(--warn); } .dt .s.soon { color: var(--accent); }
.edit { background: var(--surface); border: 1px solid var(--accent); border-radius: var(--r); padding: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.edit input, .edit select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.edit p { margin: 0; flex: 1 1 220px; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; }

.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.dgrid > .stack:last-child .row { padding-inline: 12px; }
@media (max-width: 880px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.box > h2 { font-family: var(--font-display); font-size: 15px; margin: 0; padding: 12px 14px 4px; display: flex; justify-content: space-between; align-items: baseline; }
.box > h2 small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 500; }

.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
.box > .row:first-of-type, .phase-body > .row:first-child { border-top: 0; }
.check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--ok); }
.row.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.row.na .check, .row.skip .check, .row.waived .check { background: var(--sunken); color: var(--muted); }
.row .title { min-width: 0; }
.row.done .title, .row.na .title, .row.skip .title, .row.waived .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.row .title small { color: var(--muted); text-decoration: none; display: inline-block; margin-left: 6px; font-size: 11.5px; }
.row .title .draft { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 0 0 0 6px; }
.row .r { display: flex; align-items: center; gap: 8px; }
.row .due { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.row .due.overdue { color: var(--bad); font-weight: 500; }
.row .due.today { color: var(--accent); font-weight: 500; }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
.av.as { background: var(--waive-soft); color: var(--waive); }
.more { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 16px; line-height: 1; }
.menu { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.menu button { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; font-size: 12px; padding: 2px 8px; }
.nextms { margin: 6px 14px 4px; font-size: 13px; color: var(--muted); }
.nextms b { color: var(--fg); }

.phase { border-top: 1px solid var(--line); }
.phase:first-of-type { border-top: 0; }
.phase-h { width: 100%; border: 0; background: none; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; }
.phase-h:hover { background: var(--sunken); }
.phase-h .pn { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.phase-h .pn::before { content: "›"; display: inline-block; width: 10px; color: var(--muted); transition: transform .15s; }
.phase-h[aria-expanded="true"] .pn::before { transform: rotate(90deg); }
.phase-h .pc { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.phase-h .pc .ok { color: var(--ok); font-weight: 600; }
.phase-body { background: var(--bg); }
.phase-body .row { padding-left: 32px; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; padding: 6px 14px 14px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; }
.facts .hid { color: var(--muted); font-style: italic; font-family: var(--font-body); font-size: 12px; }
.people { padding: 6px 14px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.people div { display: flex; justify-content: space-between; gap: 8px; }
.people span:last-child { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 4px 14px 12px; }

// Build each deal's checklist once.
deals.forEach(dl => {
  dl.tasks = [];
  if (dl.stage === "Closed") return;
  if (dl.stage === "Under Contract") {
    dl.msStatus = dl.msStatus || {};
    Object.keys(dl.ms).forEach(k => { if (!dl.msStatus[k]) dl.msStatus[k] = d(dl.ms[k]) < TODAY ? "met" : "pending"; });
    CONTRACT[dl.side].forEach(([phase, t, a, o, who, kind]) => {
      if (!dl.ms[a]) return; // conditional: e.g. HOA steps only when the deal has an HOA date
      if (phase === "HOA" && !dl.ms.hoa) return;
      const task = { phase, t, a, o, who, kind: kind || "task" };
      const due = add(d(dl.ms[a]), o);
      task.s = due < TODAY && !(dl.openPast || []).includes(t) ? "done" : "open";
      if ((dl.doneEarly || []).includes(t)) task.s = "done";
      dl.tasks.push(task);
    });
  } else {
    (STAGE_STEPS[dl.side + ":" + dl.stage] || []).forEach(([t, o, who, kind], i, arr) => {
      const task = { phase: dl.stage, t, fixed: iso(add(d(dl.since), o)), who, kind: kind || "task" };
      task.s = d(task.fixed) < TODAY ? "done" : "open";
      dl.tasks.push(task);
    });
    if (dl.id === 3) dl.tasks[2].s = "open"; // one overdue lead for the demo
  }
  dl.tasks.forEach((t, i) => t.id = i);
});

const dueOf = (dl, t) => t.fixed ? d(t.fixed) : add(d(dl.ms[t.a]), t.o);
function eff(dl, t) {
  if (t.s !== "open") return t.s;
  if (t.a && dl.msStatus[t.a] === "waived") return "waived";
  return "open";
}
const openTasks = dl => dl.tasks.filter(t => eff(dl, t) === "open").sort((a, b) => dueOf(dl, a) - dueOf(dl, b));
function health(dl) {
  const od = openTasks(dl).filter(t => dueOf(dl, t) < TODAY).length;
  return od >= 3 ? "r" : od ? "y" : "g";
}

    <div class="board">${STAGES[side].map((st, i) => colHtml(st, i, list.filter(x => x.stage === st))).join("")}${editStages ? `<button class="col add" data-addstage="1">+ Add stage</button>` : ""}</div>`;

function colHtml(stage, i, items) {
  const vol = items.reduce((s, x) => s + (x.price || 0), 0);
  const closed = stage === "Closed";
  const name = label(side, stage);
  const head = editStages
    ? `<input data-rename="${esc(stage)}" value="${esc(name)}" aria-label="Stage name">
       <span class="col-tools">
         <button data-move="${esc(stage)}" data-dir="-1" aria-label="Move left" ${i === 0 ? "disabled" : ""}>←</button>
         <button data-move="${esc(stage)}" data-dir="1" aria-label="Move right" ${i === STAGES[side].length - 1 ? "disabled" : ""}>→</button>
         ${LOCKED.includes(stage) ? "" : `<button data-del="${esc(stage)}" aria-label="Remove stage">×</button>`}
         <span style="margin-left:auto;font-size:12px;color:var(--muted)">${items.length}</span>
       </span>`
    : `<span class="name"><span>${esc(name)}${closed ? " · 30 days" : ""}</span><span>${items.length}</span></span>
       <span class="vol">${vol ? money(vol) : "&nbsp;"}</span>`;
  return `<section class="col">
    <div class="col-h">${head}</div>
    <div class="cards">${items.map(cardHtml).join("")}</div>
    ${closed && !editStages ? `<div class="col-foot">View all closed →</div>` : ""}
  </section>`;
}

function cardHtml(dl) {
  let next = "";
  if (dl.stage === "Closed") {
    next = `<div class="next"><span>Closed ${short(d(dl.closed))}</span></div>`;
  } else {
    const n = openTasks(dl)[0];
    if (n) { const due = dueOf(dl, n), od = due < TODAY; next = `<div class="next ${od ? "overdue" : ""}"><span>${esc(n.t)}</span><span class="date">${od ? "Overdue" : short(due)}</span></div>`; }
  }
  const prog = dl.stage === "Under Contract" ? (() => { const done = dl.tasks.filter(t => eff(dl, t) !== "open").length; return `<div class="mini" title="${done} of ${dl.tasks.length} steps"><i style="width:${Math.round(done / dl.tasks.length * 100)}%"></i></div><div class="addr">Closing ${short(d(dl.ms.close))}</div>`; })() : "";
  return `<button class="card" data-deal="${dl.id}">
    <span class="who"><span>${esc(dl.name)}</span>${dl.stage !== "Closed" ? `<span class="dot ${health(dl)}" title="${{ g: "On track", y: "Something overdue", r: "Behind" }[health(dl)]}"></span>` : ""}</span>
    <span class="addr"><span>${esc(dl.line)}</span>${dl.price ? `<span class="price num">${money(dl.price / 1000)}k</span>` : ""}</span>
    ${prog}${next}
  </button>`;
}

function contact(cid) {
  if (CONTACTS[cid]) return CONTACTS[cid];
  if (EXTRA[cid]) {
    const [name, stage, follow, source, tags, phone, last] = EXTRA[cid];
    const f = name.split(/[ &]/)[0].toLowerCase(), l = name.split(" ").pop().toLowerCase();
    return CONTACTS[cid] = { name, stage, follow, source, referred: "", mailing: name, tags: [...tags], phones: [["Mobile", phone]], emails: [["", `${f}.${l}@example.com`]],
      address: "Twin Cities, MN", household: [], tasks: [], history: [[iso(add(TODAY, -last)), "call", "Caught up. Nothing new on their end.", "LP"], [iso(add(TODAY, -last - 30)), "email", "Gmail · Minnesota Market Update", "LP"]] };
  }
  const dl = deals.find(x => cidOf(x) === cid);
  const first = dl.name.split(/[ &]/)[0].toLowerCase(), last = dl.name.split(" ").pop().toLowerCase();
  const closed = dl.stage === "Closed";
  const c = {
    name: dl.name, stage: closed ? "30 Day Sphere" : "Lead", follow: closed ? 30 : null, source: dl.line.startsWith("Source: ") ? dl.line.slice(8) : "Sphere",
    referred: "", mailing: dl.name, tags: [dl.side === "buyer" ? "Buyer" : "Seller"].concat(closed ? ["Past Client", "Email Newsletter", "Mailers"] : ["Email Newsletter"]),
    phones: [["Mobile", "(612) 555-01" + String(dl.id).padStart(2, "0")]], emails: [["", `${first}.${last}@example.com`]],
    address: dl.side === "seller" && dl.price ? dl.line + ", MN" : "Twin Cities, MN", household: [],
    tasks: [], history: closed ? [
      [iso(add(d(dl.closed), 7)), "text", "How's the new place? Let us know if you need any vendor recs.", "LP"],
      [iso(add(d(dl.closed), 1)), "email", "Gmail · Congrats on closing! A few things for your first week", "AS"],
    ] : [
      [dl.since || dl.ms.fa, "call", dl.ms ? "Offer accepted! Walked them through next steps." : "Intro call. Next step scheduled.", "LP"],
      [dl.since || dl.ms.fa, "email", dl.ms ? "Gmail · Purchase agreement accepted" : "Gmail · Intro email", "AS"],
    ],
  };
  CONTACTS[cid] = c; return c;
}
let openContact = null, ctab = {}, tlFilter = "all", composer = "note";
const isActive = dl => dl.stage !== "Closed";
const WHO = { LP: "Luke", AS: "Alyssa" };

function renderContact() {
  const c = contact(openContact);
  const myDeals = deals.filter(x => cidOf(x) === openContact).sort((a, b) => isActive(b) - isActive(a));

  const tab = ctab[openContact];
  const stage = active.some(x => x.stage === "Under Contract") ? "Under Contract" : c.stage;
  const lastTouch = c.history.filter(h => ["note", "text", "call", "email"].includes(h[1])).map(h => d(h[0])).sort((a, b) => b - a)[0];
  const ago = lastTouch ? diff(TODAY, lastTouch) : null;

  app.innerHTML = `

          ${c.tasks.length ? c.tasks.map((t, i) => ptaskHtml(t, i)).join("") : `<p class="muted sm">No tasks outside their deals.</p>`}

          ${myDeals.map(dl => `<button class="deal-li" data-ctab="${isActive(dl) ? "deal-" + dl.id : "timeline"}">
            <span><span class="sidechip ${dl.side}">${dl.side === "buyer" ? "Buyer" : "Seller"}</span> ${esc(shortAddr(dl))}</span>
            <span class="muted sm">${esc(label(dl.side, dl.stage))}${dl.stage === "Closed" ? " · " + short(d(dl.closed)) : ""}${dl.price ? " · " + money(dl.price / 1000) + "k" : ""}</span>
          </button>`).join("") || `<p class="muted sm">No deals yet.</p>`}
          <div class="row-btns"><button class="btn" data-toast="Opens the buyer form: buyer rep dates and BAC, then a purchase agreement when they go under contract">+ Add Buyer</button><button class="btn" data-toast="Opens the seller form: listing agreement dates, list price and commission">+ Add Seller</button></div>
        </div>
      </aside>

}

const initials = n => n.split(/\s+|&/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join("");
const shortAddr = dl => dl.price ? dl.line.split(",")[0] : dl.stage;

function dealPane(dl) {
  const uc = dl.stage === "Under Contract", h = health(dl);
  const open = openTasks(dl), phases = [...new Set(dl.tasks.map(t => t.phase))];
  if (!expanded[dl.id]) { const f = phases.find(p => dl.tasks.some(t => t.phase === p && eff(dl, t) === "open")); expanded[dl.id] = new Set(f ? [f] : []); }
  const done = dl.tasks.filter(t => eff(dl, t) !== "open").length;
  const others = (dl.people || []).filter(p => !["Buyer", "Seller"].includes(p[1]));
  return `<div class="pane">
    <div class="pane-h">
      <div><b>${esc(dl.line)}</b>${dl.price ? ` <span class="num muted">${money(dl.price)}</span>` : ""}</div>
      <div class="dp-r"><span class="stagepill">${esc(label(dl.side, dl.stage))}</span><span class="dot ${h}"></span><span class="muted sm">${uc ? "Closing " + short(d(dl.ms.close)) : `${dl.tasks.length - done} open steps`}</span></div>
    </div>
    ${uc ? `<div class="pad">${datesHtml(dl)}</div><div class="factline">${factsInline(dl)}</div>` : ""}
    ${others.length ? `<div class="factline">${others.map(([n, r]) => `<span><em>${r}</em> ${esc(n)}</span>`).join("")}</div>` : ""}
    <div class="subh">Up next</div>
    ${open.length ? open.slice(0, 3).map(t => rowHtml(dl, t)).join("") : `<p class="empty">All caught up.</p>`}
    <div class="subh" style="margin-top:6px">Checklist · ${done} of ${dl.tasks.length} done</div>
    <div class="fullcl">${phases.map(p => phaseHtml(dl, p)).join("")}</div>
  </div>`;
}

function factsInline(dl) {
  return [["Price", money(dl.price)], ["Earnest", money(dl.em)], ["Seller contrib.", money(dl.sc)], ["BAC", dl.bac],
    ["Commission", role === "admin" ? money(dl.comm) : null], ["Financing", dl.fin]]
    .map(([k, v]) => `<span><em>${k}</em> ${v === null ? `<i class="hid">hidden</i>` : `<b class="num">${v}</b>`}</span>`).join("");
}

function ptaskHtml(t, i) {
  const n = diff(d(t.due), TODAY), done = t.s === "done";
  return `<div class="ptask ${done ? "done" : ""}">
    <button class="check" data-ptask="${i}" aria-label="Mark ${done ? "not done" : "done"}: ${esc(t.t)}">${done ? CHECK : ""}</button>
    <div><div class="title">${esc(t.t)}</div><div class="sm ${!done && n < 0 ? "od" : !done && n === 0 ? "td" : "muted"}">${n === 0 && !done ? "Today" : fmt(d(t.due))} · ${WHO[t.who]}</div></div>
  </div>`;
}

const KIND = { note: "Note", text: "Text", call: "Call", missed: "Missed call", email: "Email", stage: "Stage", done: "Step done" };
function timelinePane(c, myDeals) {
  const items = c.history.map(([dt, k, txt, who]) => ({ dt, k, txt, who }));
  myDeals.forEach(dl => {
    const where = dl.side === "buyer" ? "Buyer" : "Seller";
    items.push(dl.stage === "Closed" ? { dt: dl.closed, k: "stage", txt: `${where} deal closed · ${dl.line}` } : { dt: dl.ms ? dl.ms.fa : dl.since, k: "stage", txt: `${where} deal moved to ${label(dl.side, dl.stage)}` });
    dl.tasks.filter(t => t.s === "done").forEach(t => items.push({ dt: iso(dueOf(dl, t) > TODAY ? TODAY : dueOf(dl, t)), k: "done", txt: t.t, who: t.who }));
  });
  const F = { all: () => true, note: i => i.k === "note", text: i => i.k === "text", call: i => i.k === "call" || i.k === "missed", email: i => i.k === "email", deal: i => i.k === "stage" || i.k === "done" };
  const list = items.filter(F[tlFilter]).sort((a, b) => d(b.dt) - d(a.dt));
  const count = k => items.filter(F[k]).length;
  return `<div class="pane">
    <div class="composer">
      <div class="comp-tabs">${[["note", "Note"], ["text", "Send text"], ["logtext", "Log text"], ["call", "Log call"]].map(([k, l]) => `<button data-comp="${k}" aria-pressed="${composer === k}">${l}</button>`).join("")}</div>
      ${composer === "call" ? `<div class="comp-row"><select id="call-outcome" aria-label="Call outcome"><option>Talked</option><option>Left voicemail</option><option>No answer</option></select></div>` : ""}
      <textarea id="comp-text" rows="3" placeholder="${composer === "note" ? "Add a note. Type @alyssa to notify." : composer === "text" ? "Text " + esc((c.phones[0] || ["", "them"])[1]) + " from your business number" : composer === "logtext" ? "What did you text them? For texts sent from your own phone." : "What did you talk about?"}"></textarea>
      <div class="comp-foot"><span class="muted sm">${composer === "text" ? "Replies show up in Messages and here." : composer === "logtext" ? "Records the text here without sending anything." : "Email stays in Gmail. Sent and received emails show up here automatically."}</span><button class="btn primary" data-save="1">${composer === "note" ? "Save note" : composer === "text" ? "Send text" : composer === "logtext" ? "Log text" : "Log call"}</button></div>
    </div>
    <div class="tl-filters">${[["all", "All"], ["note", "Notes"], ["text", "Texts"], ["call", "Calls"], ["email", "Emails"], ["deal", "Deal activity"]].map(([k, l]) => `<button data-tlf="${k}" aria-pressed="${tlFilter === k}">${l} <span>${count(k)}</span></button>`).join("")}</div>
    ${list.length ? `<ol class="tl">${list.map(i => `<li><span class="tk ${i.k}">${KIND[i.k]}</span><div><div>${esc(i.txt)}</div><div class="muted sm">${fmt(d(i.dt))}${i.who ? " · " + WHO[i.who] : ""}</div></div></li>`).join("")}</ol>` : `<p class="empty">Nothing here yet.</p>`}
  </div>`;
}

function datesHtml(dl) {
  const keys = Object.keys(dl.ms);
  let html = `<div class="dates">${keys.map(k => {
    const st = dl.msStatus[k], n = diff(d(dl.ms[k]), TODAY);
    const txt = st === "met" ? "✓ Met" : st === "waived" ? "Waived" : st === "extended" ? "Extended" : n === 0 ? "Today" : n > 0 ? `In ${n} days` : "Past due";
    const cls = st !== "pending" ? st : n <= 3 ? "soon" : "";
    return `<button class="dt" data-dl="${dl.id}" data-ms="${k}" aria-expanded="${editing === dl.id + ":" + k}"><span class="l">${MS_NAMES[k]}</span><span class="v date">${fmt(d(dl.ms[k]))}</span><span class="s ${cls}">${txt}</span></button>`;
  }).join("")}</div>`;
  const k = editing && editing.startsWith(dl.id + ":") ? editing.split(":")[1] : null;
  if (k) {
    const n = dl.tasks.filter(t => t.a === k && t.s === "open").length;
    html += `<div class="edit">
      <label>${MS_NAMES[k]} date<input type="date" data-msdate="${dl.id}:${k}" value="${dl.ms[k]}"></label>
      <label>Status<select data-msstatus="${dl.id}:${k}">${["pending", "met", "waived", "extended"].map(s => `<option value="${s}" ${s === dl.msStatus[k] ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`).join("")}</select></label>
      <p>${n} open step${n === 1 ? "" : "s"} move with this date. Waived clears them.</p>
      <button class="btn" data-close="1">Done</button>
    </div>`;
  }
  return html;
}

function phaseHtml(dl, p) {
  const items = dl.tasks.filter(t => t.phase === p).sort((a, b) => dueOf(dl, a) - dueOf(dl, b));
  const done = items.filter(t => eff(dl, t) !== "open").length;
  const isOpen = expanded[dl.id].has(p);
  const od = items.some(t => eff(dl, t) === "open" && dueOf(dl, t) < TODAY);
  return `<div class="phase">
    <button class="phase-h" data-dl="${dl.id}" data-phase="${esc(p)}" aria-expanded="${isOpen}">
      <span class="pn">${esc(p)}</span>
      <span class="pc">${od ? `<span class="dot y"></span>` : ""}${done === items.length ? `<span class="ok">✓ Done</span>` : `${done}/${items.length}`}</span>
    </button>
    ${isOpen ? `<div class="phase-body">${items.map(t => rowHtml(dl, t)).join("")}</div>` : ""}
  </div>`;
}

function rowHtml(dl, t) {
  const st = eff(dl, t), due = dueOf(dl, t), n = diff(due, TODAY);
  const icon = st === "done" ? CHECK : st === "open" ? "" : DASH;
  const note = st === "na" ? "N/A" : st === "skip" ? "Skipped" : st === "waived" ? "Waived" : "";
  const dueCls = st === "open" ? (n < 0 ? "overdue" : n === 0 ? "today" : "") : "";
  const rule = t.a ? `${MS_NAMES[t.a]} ${t.o === 0 ? "day of" : (t.o > 0 ? "+ " : "− ") + Math.abs(t.o) + "d"}` : "";
  const key = dl.id + ":" + t.id, A = `data-dl="${dl.id}"`;
  return `<div class="row ${st}">
    <button class="check" ${A} data-toggle="${t.id}" aria-label="Mark ${st === "done" ? "not done" : "done"}: ${esc(t.t)}">${icon}</button>
    <span class="title">${esc(t.t)}${note ? `<small>${note}</small>` : ""}${t.kind !== "task" && st === "open" ? `<button class="draft" ${A} data-draft="${t.id}">Draft ${t.kind}</button>` : ""}</span>
    <span class="r"><span class="due date ${dueCls}" title="${rule}">${n === 0 && st === "open" ? "Today" : short(due)}</span><span class="av ${t.who === "AS" ? "as" : ""}">${t.who}</span><button class="more" ${A} data-menu="${t.id}" aria-label="More options">⋯</button></span>
    ${openMenu === key ? `<div class="menu">
      ${st !== "na" ? `<button ${A} data-set="na" data-id="${t.id}">Mark N/A</button>` : ""}
      ${st !== "skip" ? `<button ${A} data-set="skip" data-id="${t.id}">Skip</button>` : ""}
      ${st !== "open" && st !== "waived" ? `<button ${A} data-set="open" data-id="${t.id}">Reopen</button>` : ""}
      ${rule ? `<span style="font-size:12px;color:var(--muted);align-self:center">Timing: ${rule}</span>` : ""}
    </div>` : ""}
  </div>`;
}

const head = (title, key) => `<h3>${title}${editCard === key ? "" : `<button class="edit-btn" data-editcard="${key}">Edit</button>`}</h3>`;

function tagsCard(c) {

function householdCard(c) {
  if (editCard === "household") {
    return `<div class="card-s ed">${head("Household &amp; dates", "household")}
      ${listRows(draft.household, "h", "Date, e.g. Mar 4")}<button class="addlink" data-addrow="h">+ Add person or date</button>
      ${foot("household")}</div>`;
  }
  return `<div class="card-s">${head("Household &amp; dates", "household")}
    ${c.household.length ? `<dl class="kv">${c.household.map(([n, b]) => `<dt>${esc(n)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>` : `<p class="muted sm">No birthdays or dates yet.</p>`}</div>`;
}

function collect() {
  if (!draft) return;
  const q = s => [...document.querySelectorAll(s)];
  q("[data-f]").forEach(i => { if (i.value !== "__new") draft[i.dataset.f] = i.value; });
  [["p", "phones"], ["e", "emails"], ["h", "household"]].forEach(([k, f]) => {
    q(`[data-${k}l]`).forEach(i => draft[f][+i.getAttribute(`data-${k}l`)][0] = i.value);
    q(`[data-${k}v]`).forEach(i => draft[f][+i.getAttribute(`data-${k}v`)][1] = i.value);
  });
  q("[data-new]").forEach(i => draft["new_" + i.dataset.new] = i.value);
}

function saveCard(key) {
  collect();
  const c = contact(openContact);
  if (key === "info") {
    c.name = draft.name.trim() || c.name; c.address = draft.address;
    c.phones = draft.phones.filter(r => r[1].trim()); c.emails = draft.emails.filter(r => r[1].trim());
  }
  if (key === "details") {
    ["stage", "follow", "assigned", "source"].forEach(k => {
      if (draft.newMode[k] && (draft["new_" + k] || "").trim()) { const v = draft["new_" + k].trim(); if (!OPTS[k].includes(v)) OPTS[k].push(v); draft[k] = v; }
    });
    c.stage = draft.stage; c.assigned = draft.assigned; c.source = draft.source; c.referred = draft.referred; c.mailing = draft.mailing;
    const f = typeof draft.follow === "string" ? draft.follow : followTxt(draft.follow);
    const n = f.match(/\d+/); c.follow = n ? +n[0] : null;
  }
  if (key === "household") c.household = draft.household.filter(r => r[0].trim() || r[1].trim());
  editCard = null; draft = null;
  toast("Saved.");
  render();
}

/* ---------- Events ---------- */
function render() { openContact ? renderContact() : renderBoard(); }
let tt;
function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

function openCard(dealId) {
  const dl = deals.find(x => x.id === dealId);
  openContact = cidOf(dl); side = dl.side; editing = null; editCard = null; draft = null; tagAdding = false; openMenu = null; tlFilter = "all";
  ctab[openContact] = isActive(dl) ? "deal-" + dl.id : "timeline";
  render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const dl = b.dataset.dl ? deals.find(x => x.id === +b.dataset.dl) : null;
  if (b.dataset.side) { side = b.dataset.side; render(); return; }
  if (b.dataset.editstages) { editStages = !editStages; render(); return; }
  if (b.dataset.move) {
    const arr = STAGES[side], i = arr.indexOf(b.dataset.move), j = i + +b.dataset.dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; render(); return;
  }
  if (b.dataset.del) {
    const k = b.dataset.del;
    if (deals.some(x => x.side === side && x.stage === k)) { toast(`Move the deals out of "${label(side, k)}" before removing it.`); return; }
    STAGES[side].splice(STAGES[side].indexOf(k), 1); toast(`Removed "${label(side, k)}".`); render(); return;
  }
  if (b.dataset.addstage) {
    const k = "custom-" + (++customN);
    LABEL[side][k] = "New stage";
    STAGES[side].splice(STAGES[side].indexOf("Under Contract"), 0, k);
    render();
    const inp = document.querySelector(`[data-rename="${k}"]`); if (inp) { inp.focus(); inp.select(); }
    return;
  }
  if (b.dataset.deal) { openCard(+b.dataset.deal); return; }
  if (b.dataset.editcard) { const c = contact(openContact); editCard = b.dataset.editcard; draft = JSON.parse(JSON.stringify(c)); draft.assigned = draft.assigned || "Luke Pettersen"; draft.newMode = {}; render(); return; }
  if (b.dataset.cancelcard) { editCard = null; draft = null; render(); return; }
  if (b.dataset.savecard) { saveCard(b.dataset.savecard); return; }
  if (b.dataset.addrow) { collect(); const f = { p: "phones", e: "emails", h: "household" }[b.dataset.addrow]; draft[f].push([b.dataset.addrow === "p" ? "Mobile" : "", ""]); render(); return; }
  if (b.dataset.rm) { collect(); const [k, i] = b.dataset.rm.split(":"); draft[{ p: "phones", e: "emails", h: "household" }[k]].splice(+i, 1); render(); return; }
  if (b.dataset.rmtag) { const c = contact(openContact); const t = c.tags.splice(+b.dataset.rmtag, 1)[0]; toast(`Removed tag "${t}".`); render(); return; }
  if (b.dataset.tagadd) { tagAdding = true; render(); const i = el("tag-in"); if (i) i.focus(); return; }
  if (b.dataset.tagcancel) { tagAdding = false; render(); return; }
  if (b.dataset.tagsave) { addTag(); return; }
  if (b.dataset.opencontact) { openContact = b.dataset.opencontact; tlFilter = "all"; editing = null; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.back) { openContact = null; editing = null; try { history.replaceState(null, "", location.pathname); } catch (_) {} render(); return; }
  if (b.dataset.ctab) { ctab[openContact] = b.dataset.ctab; editing = null; render(); return; }
  if (b.dataset.comp) { composer = b.dataset.comp; render(); const t = el("comp-text"); if (t) t.focus(); return; }
  if (b.dataset.tlf) { tlFilter = b.dataset.tlf; render(); return; }
  if (b.dataset.save) {
    const ta = el("comp-text"), txt = ta && ta.value.trim();
    if (!txt) { toast("Type something first."); return; }
    const c = contact(openContact);
    const kind = composer === "call" ? "call" : composer === "logtext" ? "text" : composer;
    const out = composer === "call" ? el("call-outcome").value + ": " : composer === "logtext" ? "Logged: " : "";
    c.history.unshift([iso(TODAY), kind, out + txt, "LP"]);
    toast(composer === "note" ? "Note saved." : composer === "text" ? "Text sent." : composer === "logtext" ? "Text logged." : "Call logged.");
    render(); return;
  }
  if (b.dataset.ptask) { const t = contact(openContact).tasks[+b.dataset.ptask]; t.s = t.s === "open" ? "done" : "open"; render(); return; }
  if (b.dataset.ms) { const k = dl.id + ":" + b.dataset.ms; editing = editing === k ? null : k; render(); return; }
  if (b.dataset.close) { editing = null; render(); return; }
  if (b.dataset.phase) { const s = expanded[dl.id]; s.has(b.dataset.phase) ? s.delete(b.dataset.phase) : s.add(b.dataset.phase); render(); return; }
  if (b.dataset.toggle) {
    const t = dl.tasks[+b.dataset.toggle];
    if (eff(dl, t) === "waived") { toast("Cleared by a waived deadline."); return; }
    t.s = t.s === "open" ? "done" : "open";
    if (t.s === "done") toast("Done. Logged to the timeline and cleared from Tasks.");
    render(); return;
  }
  if (b.dataset.menu) { const k = dl.id + ":" + b.dataset.menu; openMenu = openMenu === k ? null : k; render(); return; }
  if (b.dataset.set) { dl.tasks[+b.dataset.id].s = b.dataset.set; openMenu = null; render(); return; }
  if (b.dataset.draft) { const t = dl.tasks[+b.dataset.draft]; toast(`Opens a pre-filled ${t.kind}: "${t.t}". You review, then send.`); return; }
  if (b.dataset.toast) { toast(b.dataset.toast); return; }
  if (b.id === "role-admin" || b.id === "role-assistant") {
    role = b.id === "role-admin" ? "admin" : "assistant";
    el("role-admin").setAttribute("aria-pressed", role === "admin");
    el("role-assistant").setAttribute("aria-pressed", role === "assistant");
    render(); return;
  }
});

document.addEventListener("change", e => {
  const ds = e.target.dataset;
  if (ds.f && e.target.value === "__new") { collect(); draft.newMode[ds.f] = true; render(); const i = document.querySelector(`[data-new="${ds.f}"]`); if (i) i.focus(); return; }
  if (ds.rename) { const v = e.target.value.trim(); if (v) LABEL[side][ds.rename] = v; render(); return; }
  if (ds.msdate && e.target.value) {
    const [id, k] = ds.msdate.split(":"), dl = deals.find(x => x.id === +id);
    const n = dl.tasks.filter(t => t.a === k && t.s === "open").length;
    dl.ms[k] = e.target.value;
    if (dl.msStatus[k] === "pending") dl.msStatus[k] = "extended";
    toast(`${MS_NAMES[k]} moved to ${fmt(d(e.target.value))}. ${n} step${n === 1 ? "" : "s"} re-dated.`);
    render(); return;
  }
  if (ds.msstatus) { const [id, k] = ds.msstatus.split(":"); deals.find(x => x.id === +id).msStatus[k] = e.target.value; render(); }
});

function addTag() {
  const i = el("tag-in"), v = i && i.value.trim(); if (!v) return;
  const c = contact(openContact);
  if (!c.tags.includes(v)) c.tags.push(v);
  const isNew = !ALL_TAGS.includes(v); if (isNew) ALL_TAGS.push(v);
  tagAdding = false; toast(isNew ? `Created new tag "${v}".` : `Tagged "${v}".`); render();
}
document.addEventListener("keydown", e => { if (e.target.id === "tag-in" && e.key === "Enter") { e.preventDefault(); addTag(); } if (e.target.id === "tag-in" && e.key === "Escape") { tagAdding = false; render(); } });

// Deep link from the Tasks mockup: deals.html#contact-calloway
function fromHash() {
  const m = location.hash.match(/^#contact-([\w-]+)$/);
  if (m && (CONTACTS[m[1]] || EXTRA[m[1]] || deals.some(x => cidOf(x) === m[1]))) {
    openContact = m[1]; tlFilter = "all";
    const first = deals.find(x => cidOf(x) === m[1] && isActive(x));
    if (first) side = first.side;
    render(); window.scrollTo(0, 0);
  }
}
window.addEventListener("hashchange", fromHash);
render();
fromHash();
</script>
