<title>Messages Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f6f7; --surface: #ffffff; --sunken: #eaeef0; --line: #d8dee2; --fg: #16222a; --muted: #5b6b75;
  --accent: #1d6a85; --accent-soft: #dcecf2; --ok: #2f7a4b; --ok-soft: #e0f0e5; --warn: #9a6400; --warn-soft: #fbefd6;
  --bad: #b3372b; --bad-soft: #f9e1de; --waive: #6b6480; --waive-soft: #ebe8f2;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
    --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
    --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171c; --surface: #16212a; --sunken: #1c2a34; --line: #2a3a45; --fg: #e4ecf0; --muted: #93a5b0;
  --accent: #5fb3d1; --accent-soft: #173a48; --ok: #6cc28c; --ok-soft: #173a26; --warn: #e2b04f; --warn-soft: #3d2f12;
  --bad: #f0857a; --bad-soft: #43201c; --waive: #b3abcc; --waive-soft: #2c2840; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.date, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.mock-bar { background: var(--accent-soft); padding-block: 7px; padding-inline: 16px; font-size: 13px; }
.topnav { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; display: flex; align-items: center; gap: 24px; overflow-x: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding-block: 12px; white-space: nowrap; }
.brand span { color: var(--accent); }
.topnav nav { display: flex; gap: 4px; }
.topnav nav a { color: var(--muted); text-decoration: none; padding: 14px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
.topnav nav a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 25px); line-height: 1.15; margin: 0; }
.muted { color: var(--muted); } .sm { font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; }
.tagchip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.side-nav { display: flex; flex-direction: column; gap: 12px; }
.side-nav h4 { margin: 0 0 4px; padding: 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.side-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav-i { width: 100%; border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.nav-i:hover { background: var(--sunken); }
.nav-i[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-i .c { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 40; }
@media (max-width: 760px) {
  .side-nav { flex-direction: row; overflow-x: auto; }
  .side-nav h4 { display: none; }
  .side-nav ul { flex-direction: row; gap: 6px; }
  .nav-i { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; }
}
</style>
<style>
/* Layout: conversation list | thread with composer | contact summary. Texts and missed calls only; email stays in Gmail. */
.shell { max-width: 1500px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 12px; align-items: start; }
@media (max-width: 1100px) { .shell { grid-template-columns: 280px minmax(0, 1fr); } .info { display: none; } }
@media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } .shell.thread-open .convs { display: none; } .shell:not(.thread-open) .thread { display: none; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.convs { display: flex; flex-direction: column; }
.convs .top { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: none; padding: 3px 11px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.conv { border: 0; border-top: 1px solid var(--line); background: none; text-align: left; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; }
.conv:first-of-type { border-top: 0; }
.conv.fresh { animation: pop 1.4s ease-out; }
@keyframes pop { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .conv.fresh { animation: none; background: var(--accent-soft); } }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: inherit; }
.conv:hover { background: var(--bg); }
.conv[aria-current="true"] { background: var(--accent-soft); }
.conv .n { font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.conv .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv.unread .n::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.conv .t { font-size: 12px; color: var(--muted); }
.conv .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .s.missed { color: var(--bad); font-weight: 600; }
.thread { display: flex; flex-direction: column; min-height: 70vh; }
.th-h { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.th-h b { font-size: 15px; }
.back { display: none; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; }
@media (max-width: 760px) { .back { display: inline; } }
.msgs { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 62vh; }
.day { align-self: center; font-size: 11.5px; color: var(--muted); font-weight: 600; margin: 4px 0; }
.bub { max-width: 72%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
.bub small { display: block; font-size: 11px; opacity: .7; margin-top: 3px; }
.bub.in { align-self: flex-start; background: var(--sunken); border-bottom-left-radius: 4px; }
.bub.out { align-self: flex-end; background: var(--accent); color: var(--surface); border-bottom-right-radius: 4px; }
.sys { align-self: center; font-size: 12.5px; background: var(--bad-soft); color: var(--bad); padding: 5px 12px; border-radius: 999px; display: flex; gap: 10px; align-items: center; }
.sys button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; font-size: 12.5px; }
.comp { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.comp textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; background: var(--bg); }
.comp .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.comp select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface); max-width: 260px; }
.info { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.info h3 { margin: 0; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; font-size: 12.5px; } .kv dd { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.newc label { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 3px; }
.newc { display: flex; flex-direction: column; gap: 8px; }
</style>
<div class="mock-bar"><strong>Mockup</strong> · starts empty. Texts and missed calls from your business line (612) 555-0100. Email stays in Gmail. <button class="linkbtn" data-incoming="1">Simulate an incoming text</button></div>
<header class="topnav"><div class="brand">Petty Homes <span>HQ</span></div><nav aria-label="Main"><a href="people.html">People</a><a href="deals.html">Pipeline</a><a href="tasks.html">Tasks</a><a href="messages.html" class="on">Messages</a><a href="admin.html">Admin</a></nav></header>
<div class="shell" id="shell">
  <section class="panel convs" id="convs"></section>
  <section class="panel thread" id="thread"></section>
  <aside class="panel info" id="info"></aside>
</div>
<div id="toast" class="toast" hidden></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Conversations start empty. A conversation is linked to a person in People by `cid`.
// m: [direction in/out/missed, text, time label, day label, sort key]
let convs = [], cur = null, filt = "all", q = "", composing = false, confirmDel = false, linking = false;
const TEMPLATES = [
  ["", "Insert template…"],
  ["Hi {first}, just checking in! Anything I can help with?", "Check-in"],
  ["Hi {first}, the inspection is scheduled for {date}. I'll meet you there.", "Day-of-inspection"],
  ["Hi {first}, earnest money is due by {date}. Wiring instructions are in your email.", "Earnest money"],
  ["Hi {first}! Thanks for reaching out. I'm Luke with Petty Homes. What's the best time to talk?", "First reply to a lead"],
  ["Hi {first}, it's Alyssa from Luke's team. I'll be helping with paperwork and scheduling.", "Intro with assistant"],
];
const el = id => document.getElementById(id);
const person = c => c && c.cid ? HQ.contacts[c.cid] : null;
const nameOf = c => person(c) ? person(c).name : c.phone;
const first = c => person(c) ? person(c).name.split(/[ &]/)[0] : "there";
const last = c => c.m[c.m.length - 1];
let clock = 0, fresh = null;
const nowKey = () => ++clock;
const findByPhone = ph => Object.entries(HQ.contacts).find(([, c]) => c.phones.some(p => p[1].replace(/\D/g, "") === ph.replace(/\D/g, "")));
const SAMPLE_IN = [["(952) 555-0144", "Hi Luke, got your name from a friend. We're thinking about selling next spring."], ["(763) 555-0110", "Saw your sign on Lincoln Ave. Is it still available?"], ["(651) 555-0199", "Are you free for a quick call about buying this year?"]];
let nextIn = 0;
function logToTimeline(c, kind, text) { const p = person(c); if (p) p.history.unshift(["2026-10-12", kind, text, "LP"]); }
function convFor(phone) {
  let c = convs.find(x => x.phone.replace(/\D/g, "") === phone.replace(/\D/g, ""));
  if (!c) { const hit = findByPhone(phone); c = { id: convs.length ? Math.max(...convs.map(x => x.id)) + 1 : 1, phone, cid: hit ? hit[0] : null, unread: false, m: [] }; convs.push(c); }
  return c;
}

function renderList() {
  convs = convs.filter(c => !c.cid || HQ.contacts[c.cid] || (c.cid = null, true));
  let list = convs.filter(c => filt === "all" || (filt === "unread" ? c.unread : c.m.some(m => m[0] === "missed"))).sort((a, b) => (last(b) ? last(b)[4] : 0) - (last(a) ? last(a)[4] : 0));
  if (q) list = list.filter(c => (nameOf(c) + c.phone + c.m.map(m => m[1]).join(" ")).toLowerCase().includes(q.toLowerCase()));
  const withPhones = Object.entries(HQ.contacts).filter(([, p]) => p.phones.length);
  el("convs").innerHTML = `<div class="top"><input class="input" id="q" placeholder="Search messages" value="${esc(q)}" aria-label="Search messages">
    <span class="seg" role="group" aria-label="Filter">${[["all", "All"], ["unread", "Unread"], ["missed", "Missed calls"]].map(([k, l]) => `<button data-filt="${k}" aria-pressed="${filt === k}">${l}</button>`).join("")}</span>
    ${composing ? `<div class="newc"><label>To<select class="input" id="nm-to"><option value="">Type a number below…</option>${withPhones.map(([cid, p]) => `<option value="${cid}">${esc(p.name)} · ${esc(p.phones[0][1])}</option>`).join("")}</select></label>
      <label>Or a number<input class="input" id="nm-phone" placeholder="(612) 555-0123"></label>
      <span style="display:flex;gap:6px"><button class="btn primary" data-startmsg="1">Start</button><button class="btn" data-cancelmsg="1">Cancel</button></span></div>`
      : `<button class="btn" data-newmsg="1">+ New message</button>`}</div>
    ${list.map(c => { const l = last(c); return `<button class="conv ${c.unread ? "unread" : ""} ${fresh === c.id ? "fresh" : ""}" data-conv="${c.id}" aria-current="${cur === c.id}"><span class="n"><span>${esc(nameOf(c))}</span></span><span class="t">${l ? l[2] : ""}</span><span class="s ${l && l[0] === "missed" ? "missed" : ""}">${l ? (l[0] === "out" ? "You: " : "") + esc(l[1]) : "No messages yet"}</span></button>`; }).join("") || `<p class="muted" style="padding:14px">${convs.length ? "No conversations match." : "No messages yet. Texts and missed calls to your business line show up here."}</p>`}`;
  const qi = el("q"); qi.addEventListener("input", () => { q = qi.value; const pos = qi.selectionStart; renderList(); const n = el("q"); n.focus(); n.setSelectionRange(pos, pos); });
}
function renderThread() {
  const c = convs.find(x => x.id === cur);
  if (!c) { el("thread").innerHTML = `<div class="msgs" style="justify-content:center;align-items:center"><p class="muted">Pick a conversation, or start a new message.</p></div>`; return; }
  c.unread = false;
  const body = c.m.map(([dir, txt, time]) => dir === "missed"
    ? `<div class="sys">Missed call · ${time}<button data-callback="1">Call back</button><button data-calltask="1">Make task</button></div>`
    : `<div class="bub ${dir}">${esc(txt)}<small>${time}</small></div>`).join("") || `<p class="muted sm" style="align-self:center">No messages yet. Say hi.</p>`;
  el("thread").innerHTML = `<div class="th-h"><div><button class="back" data-back="1">← All</button> <b>${esc(nameOf(c))}</b> ${person(c) ? `<span class="muted sm num">${esc(c.phone)}</span>` : ""}</div>
    <div style="display:flex;gap:6px">${person(c) ? `<a class="btn" href="deals.html#contact-${c.cid}">Open contact</a>` : ""}<button class="btn" data-callback="1">Call</button><button class="btn" data-delconv="1">${confirmDel ? "Click again to delete" : "Delete"}</button></div></div>
    <div class="msgs" id="msgs">${body}</div>
    <div class="comp"><textarea id="txt" rows="2" placeholder="Text ${esc(first(c))}…"></textarea>
      <div class="row"><select id="tpl" aria-label="Insert template">${TEMPLATES.map(([v, l]) => `<option value="${esc(v)}">${l}</option>`).join("")}</select>
      <span style="display:flex;gap:8px;align-items:center"><span class="muted sm">${person(c) ? "Logged to their timeline" : "Add them to People to keep a timeline"}</span><button class="btn primary" data-send="1">Send</button></span></div></div>`;
  const m = el("msgs"); m.scrollTop = m.scrollHeight;
  el("shell").classList.add("thread-open");
}
function renderInfo() {
  const c = convs.find(x => x.id === cur);
  if (!c) { el("info").innerHTML = `<p class="muted sm" style="margin:0">Details about the person you're texting show here.</p>`; return; }
  const p = person(c);
  if (!p) {
    const all = Object.entries(HQ.contacts);
    el("info").innerHTML = `<h3>New number</h3><p class="muted sm" style="margin:0">${esc(c.phone)} isn't linked to anyone in People.</p>
      ${linking ? `<div class="newc"><label>Link to<select class="input" id="ln-cid">${all.map(([cid, x]) => `<option value="${cid}">${esc(x.name)}</option>`).join("")}</select></label><span style="display:flex;gap:6px"><button class="btn primary" data-dolink="1">Link</button><button class="btn" data-cancellink="1">Cancel</button></span></div>`
      : `<div class="newc"><label>Name<input class="input" id="nc-name" placeholder="Full name"></label>
      <label>Stage<select class="input" id="nc-stage">${HQ.settings.stages.map(s => `<option ${s === "Lead" ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
      <label>Source<select class="input" id="nc-source">${HQ.settings.sources.map(s => `<option>${esc(s)}</option>`).join("")}</select></label>
      <button class="btn primary" data-create="1">Add to People</button>${all.length ? `<button class="btn" data-linkopen="1">Link to existing person</button>` : ""}</div>`}`;
    return;
  }
  el("info").innerHTML = `<h3>${esc(p.name)}</h3>
    <dl class="kv"><dt>Stage</dt><dd>${esc(p.stage)}</dd><dt>Phone</dt><dd class="num">${esc(c.phone)}</dd>${p.source ? `<dt>Source</dt><dd>${esc(p.source)}</dd>` : ""}</dl>
    ${p.tags.length ? `<div class="tags">${p.tags.map(t => `<span class="tagchip">${esc(t)}</span>`).join("")}</div>` : ""}
    <a class="btn" href="deals.html#contact-${c.cid}">Open contact page</a>
    <button class="btn" data-followtask="1">+ Follow-up task</button>`;
}
function render() { renderList(); renderThread(); renderInfo(); if (cur === null) el("shell").classList.remove("thread-open"); }
let tt; function toast(m) { const t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); }
function addTask(c, t) { if (!person(c)) { toast("Add them to People first so the task has a name on it."); return; } person(c).tasks.push({ t, due: "2026-10-12", who: "LP", s: "open" }); toast(`Task added: ${t}. It's on the Tasks page.`); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const ds = b.dataset;
  if (confirmDel && !ds.delconv) confirmDel = false;
  if (ds.incoming) {
    const withPhones = Object.values(HQ.contacts).filter(p => p.phones.length);
    let phone, text;
    if (withPhones.length && nextIn % 2) { const p = withPhones[nextIn % withPhones.length]; phone = p.phones[0][1]; text = "Hi! Quick question when you have a minute."; }
    else [phone, text] = SAMPLE_IN[nextIn % SAMPLE_IN.length];
    nextIn++;
    const c = convFor(phone); c.m.push(["in", text, "Now", "Today", nowKey()]); logToTimeline(c, "text", "Received: " + text);
    if (c.id !== cur) c.unread = true;
    fresh = c.id; renderList(); if (c.id === cur) renderThread();
    toast(`New text from ${nameOf(c)}`); setTimeout(() => { fresh = null; }, 1500); return;
  }
  if (ds.newmsg) { composing = true; renderList(); return; }
  if (ds.cancelmsg) { composing = false; renderList(); return; }
  if (ds.startmsg) {
    const cid = el("nm-to").value, phone = cid ? HQ.contacts[cid].phones[0][1] : el("nm-phone").value.trim();
    if (!phone) { toast("Pick a person or type a number."); return; }
    const c = convFor(phone); if (cid) c.cid = cid; composing = false; cur = c.id; render(); el("txt").focus(); return;
  }
  if (ds.conv) { cur = +ds.conv; linking = false; render(); return; }
  if (ds.filt) { filt = ds.filt; renderList(); return; }
  if (ds.back) { el("shell").classList.remove("thread-open"); return; }
  if (ds.send) {
    const t = el("txt"), v = t.value.trim(); if (!v) { t.focus(); return; }
    const c = convs.find(x => x.id === cur); c.m.push(["out", v, "Now", "Today", nowKey()]); logToTimeline(c, "text", v); render(); toast(person(c) ? "Sent and logged to their timeline." : "Sent."); return;
  }
  if (ds.create) {
    const c = convs.find(x => x.id === cur), n = el("nc-name").value.trim(); if (!n) { toast("Add a name first."); el("nc-name").focus(); return; }
    c.cid = HQ.newContact(n, { stage: el("nc-stage").value, source: el("nc-source").value, phones: [["Mobile", c.phone]] });
    c.m.forEach(m => logToTimeline(c, "text", (m[0] === "out" ? "" : "Received: ") + m[1]));
    toast(`Added ${n} to People.`); render(); return;
  }
  if (ds.linkopen) { linking = true; renderInfo(); return; }
  if (ds.cancellink) { linking = false; renderInfo(); return; }
  if (ds.dolink) { const c = convs.find(x => x.id === cur), cid = el("ln-cid").value; c.cid = cid; HQ.contacts[cid].phones.push(["Mobile", c.phone]); linking = false; toast(`Linked to ${HQ.contacts[cid].name}. Number added to their contact.`); render(); return; }
  if (ds.delconv) { if (!confirmDel) { confirmDel = true; renderThread(); return; } convs = convs.filter(x => x.id !== cur); cur = null; confirmDel = false; render(); toast("Conversation deleted."); return; }
  if (ds.callback) { const c = convs.find(x => x.id === cur); toast(`Calling ${c.phone} from your business line.`); return; }
  if (ds.calltask) { const c = convs.find(x => x.id === cur); addTask(c, `Call back ${person(c) ? person(c).name : c.phone}`); return; }
  if (ds.followtask) { const c = convs.find(x => x.id === cur); addTask(c, `Follow up with ${person(c).name}`); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "tpl" && e.target.value) {
    const c = convs.find(x => x.id === cur);
    el("txt").value = e.target.value.replace("{first}", first(c)).replace("{date}", "Wed Oct 14"); e.target.value = ""; el("txt").focus();
  }
});
render();
</script>
